<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 730" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">聚合：审核的是一次指导关系</title>
<desc id="desc">教师指导学生构成的联系被整体聚合，再与院系建立审核联系。框内整体代表一位教师对一名学生的指导记录，院系审核这一记录。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">聚合：审核的是一次指导关系</text>
<rect x="30" y="115" width="580" height="240" rx="10" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="9 7"/>
<text x="320" y="155" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">一次指导关系</text>
<rect x="55" y="205" width="155" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="132.5" y="240" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">教师</text>
<path d="M320.0 190 L385 235.0 L320.0 280 L255 235.0 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="243.0" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">指导</text>
<rect x="430" y="205" width="155" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="507.5" y="240" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">学生</text>
<path d="M210 235 H255" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M385 235 H430" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M320 355 V420" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<path d="M320.0 420 L400 470.0 L320.0 520 L240 470.0 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="478.0" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">审核</text>
<path d="M320 520 V575" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="200" y="575" width="240" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="610" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">院系</text>
<text x="320" y="695" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">先把“教师—指导—学生”作为整体</text>
</g>
</svg>
