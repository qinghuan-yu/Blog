<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1190" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">ScoreDB：把学期纳入成绩的主键</title>
<desc id="desc">Student.classNo引用Class；Score.studentNo、courseNo、termNo分别引用Student、Course、Term。Score主键由学生、课程和学期三列组成，同一学生同一门课在不同学期有不同成绩。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">ScoreDB：把学期纳入成绩的主键</text>
<rect x="190" y="100" width="260" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="135" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">Class</text>
<text x="320.0" y="171" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PK：classNo</text>
<rect x="160" y="290" width="320" height="132" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="325" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">Student</text>
<text x="320.0" y="361" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PK：studentNo</text>
<text x="320.0" y="397" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">FK：classNo</text>
<path d="M320 290 V196" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="25" y="540" width="270" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="160.0" y="575" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">Course</text>
<text x="160.0" y="611" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PK：courseNo</text>
<rect x="345" y="540" width="270" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="575" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">Term</text>
<text x="480.0" y="611" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PK：termNo</text>
<rect x="125" y="780" width="390" height="132" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="815" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">Score</text>
<text x="320.0" y="851" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">studentNo · courseNo · termNo</text>
<text x="320.0" y="887" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">score</text>
<path d="M320 780 V422" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<path d="M125 840 H75 V636" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
<path d="M515 840 H565 V636" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
<text x="320" y="1010" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">复合主键：学生 + 课程 + 学期</text>
<text x="320" y="1065" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">三列同时分别引用对应实体的主键</text>
<text x="320" y="1125" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">箭头从外键指向被引用的主键</text>
</g>
</svg>
