<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1010" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">SQL：按逻辑处理顺序读查询</title>
<desc id="desc">常见SELECT查询的逻辑处理顺序为FROM/JOIN/ON生成行源，WHERE筛选行，GROUP BY形成组，HAVING筛选组，SELECT产生输出列，DISTINCT去重，ORDER BY排序，最后LIMIT/OFFSET取结果范围。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">SQL：按逻辑处理顺序读查询</text>
<rect x="70" y="95" width="500" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="130" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">1. FROM / JOIN / ON</text>
<text x="320.0" y="160" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">连接数据源，形成行</text>
<path d="M320 179 V203" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="70" y="203" width="500" height="84" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="238" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">2. WHERE</text>
<text x="320.0" y="268" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">筛选符合条件的行</text>
<path d="M320 287 V311" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="70" y="311" width="500" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="346" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">3. GROUP BY</text>
<text x="320.0" y="376" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">把行分组</text>
<path d="M320 395 V419" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="70" y="419" width="500" height="84" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="454" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">4. HAVING</text>
<text x="320.0" y="484" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">筛选符合条件的组</text>
<path d="M320 503 V527" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="70" y="527" width="500" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="562" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">5. SELECT</text>
<text x="320.0" y="592" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">计算输出列</text>
<path d="M320 611 V635" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="70" y="635" width="500" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="670" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">6. DISTINCT</text>
<text x="320.0" y="700" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">对输出结果去重</text>
<path d="M320 719 V743" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="70" y="743" width="500" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="778" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">7. ORDER BY</text>
<text x="320.0" y="808" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">排序</text>
<path d="M320 827 V851" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="70" y="851" width="500" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="886" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">8. LIMIT / OFFSET</text>
<text x="320.0" y="916" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">取指定范围</text>
<text x="320" y="990" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">WHERE 处理行；HAVING 处理组</text>
</g>
</svg>
