<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 870" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">2NF：拆开对部分码的依赖</title>
<desc id="desc">SC的候选码为(Sno,Cno)。Sno决定Sname，Cno决定Cname，二者都是对组合码的部分依赖；完整组合决定Grade。拆分为Student、Course与SC三张表。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">2NF：拆开对部分码的依赖</text>
<text x="320" y="90" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">SC(Sno, Cno, Sname, Cname, Grade)</text>
<rect x="40" y="135" width="230" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="155.0" y="170" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">Sno</text>
<rect x="370" y="135" width="230" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="485.0" y="170" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">Cno</text>
<path d="M155 195 V245" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<path d="M485 195 V245" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
<rect x="40" y="245" width="230" height="60" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="155.0" y="280" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">Sname</text>
<rect x="370" y="245" width="230" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="485.0" y="280" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="600">Cname</text>
<text x="155" y="350" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">部分依赖</text>
<text x="485" y="350" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">部分依赖</text>
<path d="M155 195 V215 H320" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M485 195 V215 H320" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M320 215 V405" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
<rect x="195" y="405" width="250" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="440" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">Grade</text>
<text x="320" y="510" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">成绩由 (Sno, Cno) 共同决定</text>
<path d="M320 535 V585" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="45" y="585" width="550" height="60" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="620" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">Student(Sno, Sname)</text>
<rect x="45" y="675" width="550" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="320.0" y="710" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="600">Course(Cno, Cname)</text>
<rect x="45" y="765" width="550" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="800" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">SC(Sno, Cno, Grade)</text>
</g>
</svg>
