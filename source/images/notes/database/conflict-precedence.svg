<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">调度到优先图：先找真正的冲突</title>
<desc id="desc">顺序为R2(A)、R1(A)、R2(B)、W2(B)、R1(A)、W3(B)。R2(B)与W3(B)、W2(B)与W3(B)冲突，两对都只产生T2到T3。T1孤立，图无环，可有T1,T2,T3或T2,T1,T3或T2,T3,T1等串行顺序。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">调度到优先图：先找真正的冲突</text>
<text x="320" y="88" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">从上到下是调度顺序</text>
<text x="80" y="142" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">时刻</text>
<text x="220" y="142" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">T1</text>
<text x="380" y="142" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">T2</text>
<text x="540" y="142" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="500">T3</text>
<text x="80" y="195" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">1</text>
<rect x="315" y="162" width="130" height="54" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="380.0" y="197" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">R₂(A)</text>
<text x="80" y="260" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">2</text>
<rect x="155" y="227" width="130" height="54" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="220.0" y="262" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">R₁(A)</text>
<text x="80" y="325" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">3</text>
<rect x="315" y="292" width="130" height="54" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="380.0" y="327" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">R₂(B)</text>
<text x="80" y="390" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">4</text>
<rect x="315" y="357" width="130" height="54" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="380.0" y="392" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">W₂(B)</text>
<text x="80" y="455" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">5</text>
<rect x="155" y="422" width="130" height="54" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="220.0" y="457" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">R₁(A)</text>
<text x="80" y="520" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">6</text>
<rect x="475" y="487" width="130" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="540.0" y="522" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="600">W₃(B)</text>
<path d="M455 325 H610 V520 H606" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<path d="M455 390 H590 V505 H606" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<text x="320" y="620" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">两对 B 上的冲突 → 同一条边</text>
<rect x="65" y="690" width="110" height="75" rx="36" fill="none" stroke="#64748b" stroke-width="2"/>
<text x="120" y="739" font-size="28" fill="#64748b" text-anchor="middle" font-weight="600">T1</text>
<rect x="285" y="690" width="110" height="75" rx="36" fill="none" stroke="#0d9488" stroke-width="2"/>
<text x="340" y="739" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="600">T2</text>
<rect x="485" y="690" width="110" height="75" rx="36" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="540" y="739" font-size="28" fill="#2563eb" text-anchor="middle" font-weight="600">T3</text>
<path d="M395 728 H485" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<text x="120" y="810" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">独立节点</text>
<text x="445" y="810" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">T2 → T3</text>
<text x="320" y="875" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">图中无环：冲突可串行化</text>
<text x="320" y="929" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">顺序可为 T1→T2→T3 或 T2→T3→T1</text>
</g>
</svg>
