<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1260" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">无损连接：拆开后能准确拼回</title>
<desc id="desc">左例满足A决定B，R有(a,b,c1)、(a,b,c2)，投影AB与AC后连接准确还原。右例独立采用无A决定B约束的数据(a,b1,c1)、(a,b2,c2)，投影后连接产生额外(a,b1,c2)、(a,b2,c1)。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
