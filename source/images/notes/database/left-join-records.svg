<text x="130.0" y="582" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">小周</text>
<text x="320.0" y="582" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">NULL</text>
<text x="510.0" y="582" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">NULL</text>
<text x="320" y="660" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">一对多匹配 → 小林出现两行</text>
<text x="320" y="710" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">没有匹配课程 → 小周仍有一行</text>
<text x="320" y="760" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">右表列用 NULL 补齐</text>
<text x="320" y="835" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">结果行数由匹配数量共同决定</text>
