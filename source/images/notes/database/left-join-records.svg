<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">LEFT JOIN：保留每个学生</title>
<desc id="desc">Student中有S1小林、S2小周；SC中S1选了C1和C2。左连接结果中小林对应两行，小周仍保留一行，其课程号与成绩为NULL。</desc>
