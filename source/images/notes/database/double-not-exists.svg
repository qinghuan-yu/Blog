<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">双重 NOT EXISTS：找选齐课程的人</title>
<desc id="desc">课程集合为C1,C2,C3。S1选齐三门，S2缺C2，S3缺C3。内层NOT EXISTS发现未选课程，外层NOT EXISTS只保留没有任何未选课程的学生，即S1。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">双重 NOT EXISTS：找选齐课程的人</text>
<text x="320" y="92" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">课程集合：C1、C2、C3</text>
<rect x="40" y="140" width="560" height="176" rx="0" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="40" y="140" width="560" height="44" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="110.0" y="170" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">学生</text>
<path d="M180.0 140 V316" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="250.0" y="170" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">C1</text>
<path d="M320.0 140 V316" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="390.0" y="170" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">C2</text>
<path d="M460.0 140 V316" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="530.0" y="170" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">C3</text>
<path d="M40 184 H600" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="184" width="560" height="44" rx="0" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="110.0" y="214" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">S1</text>
<text x="250.0" y="214" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">✓</text>
<text x="390.0" y="214" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">✓</text>
<text x="530.0" y="214" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">✓</text>
<path d="M40 228 H600" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="110.0" y="258" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">S2</text>
<text x="250.0" y="258" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">✓</text>
<text x="390.0" y="258" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">缺</text>
<text x="530.0" y="258" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">✓</text>
<path d="M40 272 H600" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="110.0" y="302" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">S3</text>
<text x="250.0" y="302" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">✓</text>
<text x="390.0" y="302" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">✓</text>
<text x="530.0" y="302" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">缺</text>
<text x="320" y="380" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">内层：为每个学生找“缺的课程”</text>
<rect x="40" y="420" width="560" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="455" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">S1：无　　S2：C2　　S3：C3</text>
<path d="M320 480 V525" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="105" y="525" width="430" height="60" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="560" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">外层：缺课集合为空 → 保留 S1</text>
<text x="320" y="645" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">所有课程都选了 = 找不到一门没选的课</text>
</g>
</svg>
