<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 890" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">求闭包：A 与 C 一起推出全部属性</title>
<desc id="desc">依赖为A到B、B到F、C到D、AC到E。A和C是两个必须具备的起点，AC到E在AND节点汇合，不能把A或C单独当成E的决定因素。AC闭包为ABCDEF，A闭包ABF，C闭包CD。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">求闭包：A 与 C 一起推出全部属性</text>
<rect x="50" y="115" width="180" height="60" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="140.0" y="150" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">A</text>
<rect x="410" y="115" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="500.0" y="150" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="600">C</text>
<path d="M140 175 V235" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<path d="M500 175 V235" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
<rect x="50" y="235" width="180" height="60" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="140.0" y="270" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">B</text>
<rect x="410" y="235" width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="500.0" y="270" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="600">D</text>
<path d="M140 295 V355" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="50" y="355" width="180" height="60" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="140.0" y="390" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">F</text>
<path d="M230 145 H285 V445" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M410 145 H355 V445" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="255" y="445" width="130" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="480" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">AND</text>
<path d="M320 505 V555" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
<rect x="255" y="555" width="130" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="590" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">E</text>
<text x="320" y="675" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">A 与 C 都在闭包内，才可使用 AC → E</text>
<text x="320" y="735" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">(AC)⁺ = {A, B, C, D, E, F}</text>
<text x="320" y="785" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">A⁺ = {A, B, F}　　C⁺ = {C, D}</text>
<text x="320" y="842" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">AC 能推出全集，删去任一属性都做不到</text>
</g>
</svg>
