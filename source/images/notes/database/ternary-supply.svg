<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 950" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">三元联系：记录完整的一次供应</title>
<desc id="desc">供应商、零件、项目共同参加供应联系。样例真实三元组为(A,X,Q)、(A,Y,P)、(B,X,P)。它们的二元投影分别含(A,X)、(A,P)、(X,P)，自然组合会产生不存在的(A,X,P)，因此需要保存完整三元组。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">三元联系：记录完整的一次供应</text>
<rect x="30" y="115" width="220" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="140.0" y="150" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">供应商</text>
<rect x="390" y="115" width="220" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="500.0" y="150" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">零件</text>
<rect x="210" y="390" width="220" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="425" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">项目</text>
<path d="M320.0 230 L405 285.0 L320.0 340 L235 285.0 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="293.0" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">供应</text>
<path d="M140 175 V285 H235" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M500 175 V285 H405" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M320 340 V390" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="320" y="500" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">每一行同时回答：谁、什么零件、哪个项目</text>
<rect x="50" y="540" width="540" height="176" rx="0" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="50" y="540" width="540" height="44" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="140.0" y="570" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">供应商</text>
<path d="M230.0 540 V716" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="320.0" y="570" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">零件</text>
<path d="M410.0 540 V716" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500.0" y="570" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">项目</text>
<path d="M50 584 H590" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="140.0" y="614" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">A</text>
<text x="320.0" y="614" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">X</text>
<text x="500.0" y="614" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">Q</text>
<path d="M50 628 H590" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="140.0" y="658" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">A</text>
<text x="320.0" y="658" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">Y</text>
<text x="500.0" y="658" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">P</text>
<path d="M50 672 H590" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="140.0" y="702" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">B</text>
<text x="320.0" y="702" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">X</text>
<text x="500.0" y="702" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">P</text>
<text x="320" y="775" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">二元关系中都有：A–X、A–P、X–P</text>
<path d="M320 795 V835" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
<text x="320" y="875" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">拼出的 (A, X, P) 却不在供应记录中</text>
<text x="320" y="922" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">三元组保存了真正发生的业务关联</text>
</g>
</svg>
