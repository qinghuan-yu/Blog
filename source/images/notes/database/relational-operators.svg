<text x="93.75" y="824" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">U1</text>
<text x="231.25" y="824" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">小林</text>
<rect x="340" y="750" width="275" height="88" rx="0" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="340" y="750" width="275" height="44" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="408.75" y="780" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">用户ID</text>
<path d="M477.5 750 V838" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="546.25" y="780" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">评论</text>
<path d="M340 794 H615" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="408.75" y="824" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">U1</text>
<text x="546.25" y="824" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">喜欢这篇</text>
<path d="M162 838 V875 H320 V910" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<path d="M477 838 V875 H320" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="65" y="930" width="510" height="88" rx="0" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="65" y="930" width="510" height="44" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="192.5" y="960" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">姓名</text>
<path d="M320.0 930 V1018" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="447.5" y="960" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">评论</text>
<path d="M65 974 H575" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="192.5" y="1004" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">小林</text>
<text x="447.5" y="1004" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">喜欢这篇</text>
<text x="320" y="1090" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">连接条件：Users.UserID = Comments.UserID</text>
</g>
</svg>
