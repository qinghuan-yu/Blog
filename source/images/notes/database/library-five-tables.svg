<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1160" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">图书借阅：五张表怎样关联</title>
<desc id="desc">Book的classNo和publisherNo分别引用BookClass和Publisher，Borrow的readerNo和bookNo分别引用Reader和Book。Borrow以readerNo、bookNo、borrowDate共同作主键，不同借阅日期区分同一读者重复借同一本书。箭头从外键指向主键。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">图书借阅：五张表怎样关联</text>
<rect x="25" y="110" width="275" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="162.5" y="145" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">BookClass</text>
<text x="162.5" y="181" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PK：classNo</text>
<rect x="340" y="110" width="275" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="477.5" y="145" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">Publisher</text>
<text x="477.5" y="181" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PK：publisherNo</text>
<rect x="140" y="330" width="360" height="204" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="365" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">Book</text>
<text x="320.0" y="401" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PK：bookNo</text>
<text x="320.0" y="437" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">FK：classNo</text>
<text x="320.0" y="473" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">FK：publisherNo</text>
<text x="320.0" y="509" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">bookName · author · price</text>
<path d="M140 419 H80 V206" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<path d="M500 455 H560 V206" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
<text x="320" y="600" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">箭头：外键 → 被引用的主键</text>
<rect x="25" y="675" width="275" height="132" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="162.5" y="710" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">Reader</text>
<text x="162.5" y="746" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PK：readerNo</text>
<text x="162.5" y="782" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">readerName · workUnit</text>
<rect x="340" y="675" width="275" height="168" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="477.5" y="710" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">Borrow</text>
<text x="477.5" y="746" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">FK：readerNo</text>
<text x="477.5" y="782" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">FK：bookNo</text>
<text x="477.5" y="818" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">borrowDate · returnDate</text>
<path d="M340 735 H300" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<path d="M475 675 V620 H500 V534" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
<text x="320" y="930" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">Borrow 的复合主键</text>
<rect x="40" y="970" width="560" height="60" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="1005" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">(readerNo, bookNo, borrowDate)</text>
<text x="320" y="1080" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">同一读者 + 同一本书 + 不同借阅日期</text>
<text x="320" y="1125" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">对应不同的借阅记录</text>
</g>
</svg>
