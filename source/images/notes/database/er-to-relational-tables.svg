<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1100" data-layout="compact" role="img" aria-labelledby="title desc">
  <title id="title">E-R 到关系表：多对多如何落地</title>
  <desc id="desc">上方E-R模型：学生和课程之间为多对多的选修联系，成绩Grade属于选修联系。下方关系模式：Student以Sno为主键；Course以Cno为主键；SC以Sno和Cno为复合主键，两列同时是分别引用Student.Sno和Course.Cno的外键，Grade存放在SC。每个学生与课程组合对应一条选修记录。</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
    <text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">E-R 到关系表：多对多如何落地</text>
    <text x="320" y="83" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">学生 × 课程 → 一条选修记录</text>
    <text x="30" y="132" font-size="26" fill="#243247" text-anchor="start" font-weight="600">① 概念模型</text>
    <rect x="30" y="175" width="160" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="110" y="225" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">学生</text>
    <path d="M320 160 L390 215 L320 270 L250 215 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="320" y="224" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="600">选修</text>
    <rect x="450" y="175" width="160" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="530" y="225" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">课程</text>
    <path d="M190 215 H250" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="220" y="198" font-size="26" fill="#64748b" text-anchor="middle" font-weight="500">m</text>
    <path d="M390 215 H450" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="420" y="198" font-size="26" fill="#64748b" text-anchor="middle" font-weight="500">n</text>
    <path d="M320 270 V300" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="320" cy="332" rx="104" ry="32" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="320" y="341" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">成绩 Grade</text>
    <text x="320" y="401" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">成绩属于“选修”联系</text>
    <path d="M320 420 V470" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="30" y="514" font-size="26" fill="#243247" text-anchor="start" font-weight="600">② 关系模式</text>
    <rect x="30" y="550" width="260" height="147" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="160" y="588" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">Student · 学生表</text>
    <path d="M30 606 H290" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="52" y="643" font-size="26" fill="#243247" text-anchor="start" font-weight="600">Sno</text>
    <text x="264" y="643" font-size="24" fill="#64748b" text-anchor="end" font-weight="500">主键</text>
    <text x="52" y="679" font-size="24" fill="#64748b" text-anchor="start" font-weight="500">Sname</text>
    <rect x="350" y="550" width="260" height="147" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="480" y="588" font-size="24" fill="#243247" text-anchor="middle" font-weight="600">Course · 课程表</text>
    <path d="M350 606 H610" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="372" y="643" font-size="26" fill="#243247" text-anchor="start" font-weight="600">Cno</text>
    <text x="584" y="643" font-size="24" fill="#64748b" text-anchor="end" font-weight="500">主键</text>
    <text x="372" y="679" font-size="24" fill="#64748b" text-anchor="start" font-weight="500">Cname</text>
    <path d="M140 835 H12 V635 H45" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <path d="M500 835 H628 V635 H600" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
    <text x="148" y="738" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">引用 Sno</text>
    <text x="492" y="738" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">引用 Cno</text>
    <rect x="140" y="770" width="360" height="195" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="320" y="808" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">SC · 选修表</text>
    <path d="M140 822 H500" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="215" y="858" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="600">Sno</text>
    <text x="425" y="858" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="600">Cno</text>
    <text x="320" y="894" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">共同组成主键；各自是外键</text>
    <text x="320" y="940" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">Grade · 联系属性</text>
    <text x="320" y="1014" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">主键 (Sno, Cno) 唯一标识一条选修</text>
    <text x="320" y="1054" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">每个学生–课程组合，对应一条选修记录</text>
  </g>
</svg>
