<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1010" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">WAL 与恢复：先落日志，再写数据页</title>
<desc id="desc">WAL要求相关更新日志先持久化，再允许脏数据页写回磁盘。示例检查点记录活跃T1,T2；T1之后提交，T3之后开始，崩溃时T2,T3未提交。按本文UNDO/REDO日志模型，T1重做，T2和T3撤销。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">WAL 与恢复：先落日志，再写数据页</text>
<rect x="60" y="105" width="520" height="60" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="140" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">相关更新日志持久化</text>
<path d="M320 165 V210" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="60" y="210" width="520" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="245" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">脏数据页写回磁盘</text>
<text x="320" y="320" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">提交确认前，提交记录也要持久化</text>
<text x="320" y="395" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">UNDO / REDO 日志例题</text>
<text x="260" y="465" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">检查点</text>
<text x="535" y="465" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">崩溃</text>
<path d="M260 485 V770" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/>
<path d="M535 485 V770" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/>
<text x="55" y="548" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">T1</text>
<path d="M110 540 H405" fill="none" stroke="#0d9488" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="135" y="515" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">开始</text>
<text x="405" y="515" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">提交</text>
<text x="55" y="638" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">T2</text>
<path d="M165 630 H535" fill="none" stroke="#64748b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="180" y="606" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">开始</text>
<text x="55" y="728" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">T3</text>
<path d="M360 720 H535" fill="none" stroke="#64748b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="380" y="696" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">开始</text>
<text x="320" y="815" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">检查点活跃集 = {T1, T2}</text>
<rect x="35" y="855" width="270" height="96" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="170.0" y="890" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">REDO：T1</text>
<text x="170.0" y="926" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">已提交 → 用新值</text>
<rect x="335" y="855" width="270" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="470.0" y="890" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">UNDO：T2、T3</text>
<text x="470.0" y="926" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">未提交 → 用旧值</text>
</g>
</svg>
