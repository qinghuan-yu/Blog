<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 870" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">弱实体：订单号与行号共同定位</title>
<desc id="desc">Order为强实体，OrderItem为弱实体，双框表示弱实体，双菱形表示标识联系，明细全参与所属关系。itemNo为订单内的部分键；完整主键为(orderNo,itemNo)，orderNo同时是外键。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">弱实体：订单号与行号共同定位</text>
<rect x="170" y="105" width="300" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
