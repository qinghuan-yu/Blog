<path d="M320.0 277 L391 320.0 L320.0 363 L249 320.0 Z" fill="none" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="328.0" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500"></text>
<path d="M320 201 V270" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
