<text x="320" y="806" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">完整主键 = (orderNo, itemNo)</text>
<text x="320" y="845" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">orderNo 同时引用 Order 的主键</text>
