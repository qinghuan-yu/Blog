<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 890" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">8 秒窗口怎样变成训练样本</title>
<desc id="desc">从8秒窗口开始，检查source与target均存在，再编码并检查token数不超过1024。过长窗口在达到最小时长前二分并递归检查，短于限制仍过长者丢弃。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">8 秒窗口怎样变成训练样本</text>
<rect x="30" y="100" width="300" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="140.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">取一个 8 秒窗口</text>
<path d="M180 164 V210" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="30" y="210" width="300" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="247.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">旋律与伴奏</text>
<text x="180.0" y="279.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">是否都存在？</text>
<path d="M330 255 H400" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="365" y="235" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">否</text>
<rect x="400" y="210" width="210" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="505.0" y="247.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">缺少任一角色</text>
<text x="505.0" y="279.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">过滤该窗口</text>
<path d="M180 300 V365" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="220" y="340" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">是</text>
<rect x="30" y="365" width="300" height="85" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="399.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">编码后的长度</text>
<text x="180.0" y="431.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">≤ 1024 tokens？</text>
<path d="M330 407 H400" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="365" y="387" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">是</text>
<rect x="400" y="365" width="210" height="85" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="505.0" y="399.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">接收为</text>
<text x="505.0" y="431.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">训练样本</text>
<path d="M180 450 V520" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="220" y="490" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">否</text>
<rect x="30" y="520" width="300" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="180.0" y="557.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">二分后的时长</text>
<text x="180.0" y="589.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">仍达到最小值？</text>
<path d="M330 565 H400" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="365" y="545" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">否</text>
<rect x="400" y="520" width="210" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="505.0" y="557.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">过短且仍过长</text>
<text x="505.0" y="589.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">过滤该窗口</text>
<path d="M180 610 V675" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="220" y="650" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">是</text>
<rect x="30" y="675" width="300" height="80" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="180.0" y="707.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">二分成</text>
<text x="180.0" y="739.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">左右两个窗口</text>
<path d="M180 755 V790 H12 V255 H30" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="320" y="850" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">对子窗口重复检查，再编码与筛选</text>
</g>
</svg>
