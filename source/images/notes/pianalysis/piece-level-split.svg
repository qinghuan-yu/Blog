<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 890" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">V5：按曲目划分</title><desc id="desc">训练为 001、002、005 到 010 共 8 首 135 段，验证为 003 与 011 共 35 段，测试为 004 与 012 共 25 段。同曲片段不跨划分，test1 的 8 段单独用于外部生成和试听。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="44" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">V5：按曲目划分</text>
<text x="320" y="86" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">12 首 POP909 · 195 个和声段</text>
<rect x="60" y="125" width="520" height="95" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="163.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">先固定曲目划分</text>
<text x="320.0" y="197.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">再按和声与拍点证据选择片段</text>
<path d="M60 172 H30 V599" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M30 320 H80" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="80" y="270" width="500" height="100" rx="8" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="330.0" y="311.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">训练：001、002、005–010</text>
<text x="330.0" y="345.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">8 首 · 135 段</text>
<path d="M30 455 H80" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="80" y="405" width="500" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="330.0" y="446.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">验证：003、011</text>
<text x="330.0" y="480.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">2 首 · 35 段 · 选择检查点</text>
<path d="M30 590 H80" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="80" y="540" width="500" height="100" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="330.0" y="581.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">测试：004、012</text>
<text x="330.0" y="615.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">2 首 · 25 段 · 计算生成指标</text>
<text x="320" y="690" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">同一首歌的片段放在同一划分</text>
<rect x="60" y="735" width="520" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="320.0" y="776.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">外部 test1：8 个和声段</text>
<text x="320.0" y="810.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">用于生成与试听比较</text>
</g>
</svg>
