<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">先分曲目，再分配训练窗口</title>
<desc id="desc">按source_piece_id划分曲目集合，同一首曲子的所有窗口保持在同一侧。正文数据为训练36首1306窗口，验证4首224窗口。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">先分曲目，再分配训练窗口</text>
<text x="320" y="85" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">同一首曲子的窗口拥有同一个 source_piece_id</text>
<rect x="120" y="120" width="400" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="160.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">按 source_piece_id 划分曲目</text>
<path d="M220 184 V230 H165 V270" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M420 184 V230 H475 V270" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="30" y="270" width="270" height="70" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="165.0" y="297.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">训练曲目集合</text>
<text x="165.0" y="329.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">36 首</text>
<rect x="340" y="270" width="270" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="475.0" y="297.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">验证曲目集合</text>
<text x="475.0" y="329.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">4 首</text>
<path d="M165 340 V395" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="30" y="395" width="270" height="60" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="165.0" y="433.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">曲目 A</text>
<rect x="30" y="495" width="84" height="56" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="72.0" y="531.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">窗 1</text>
<rect x="120" y="495" width="84" height="56" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="162.0" y="531.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">窗 2</text>
<rect x="210" y="495" width="84" height="56" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="252.0" y="531.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">窗 3</text>
<path d="M165 455 V475 H72 V495" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M165 475 V495" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M165 475 H252 V495" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M475 340 V395" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="340" y="395" width="270" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="475.0" y="433.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">曲目 B</text>
<rect x="340" y="495" width="84" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="382.0" y="531.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">窗 1</text>
<rect x="430" y="495" width="84" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="472.0" y="531.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">窗 2</text>
<rect x="520" y="495" width="84" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="562.0" y="531.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">窗 3</text>
<path d="M475 455 V475 H382 V495" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M475 475 V495" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M475 475 H562 V495" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="165" y="610" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">1306 个窗口</text>
<text x="475" y="610" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="500">224 个窗口</text>
<text x="320" y="680" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">曲目 A 的所有窗口留在训练侧</text>
</g>
</svg>
