<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1060" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">V5：音高与节奏合成</title><desc id="desc">冻结 V3 给出配位 36、48、52、55。根三五通道分别映射到 MIDI 48、52、55。根音在第零格持续四格、第四格持续三格，三音在第二格持续两格，五音在第零格持续两格。低音 36 由规则持续八格。最后合并原旋律并保留 MIDI 时间元数据。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="44" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">V5：音高与节奏合成</text>
<text x="320" y="86" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">同一个两拍例子 · PPQ = 480</text>
<rect x="60" y="120" width="520" height="90" rx="8" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="156.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">V3 配位：[36, 48, 52, 55]</text>
<text x="320.0" y="190.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">一个低音 + 三个上方音</text>
<rect x="40" y="250" width="180" height="90" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="130.0" y="286.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">根音 C</text>
<text x="130.0" y="320.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">MIDI 48</text>
<rect x="230" y="250" width="180" height="90" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="286.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">三音 E</text>
<text x="320.0" y="320.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">MIDI 52</text>
<rect x="420" y="250" width="180" height="90" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="510.0" y="286.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">五音 G</text>
<text x="510.0" y="320.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">MIDI 55</text>
<text x="320" y="390" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">V5 起音与时值 → 具体音符</text>
<text x="130" y="435" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<path d="M130 455 V758" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="186" y="435" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">1</text>
<path d="M186 455 V758" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="242" y="435" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">2</text>
<path d="M242 455 V758" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="298" y="435" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">3</text>
<path d="M298 455 V758" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="354" y="435" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">4</text>
<path d="M354 455 V758" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="410" y="435" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">5</text>
<path d="M410 455 V758" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="466" y="435" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">6</text>
<path d="M466 455 V758" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="522" y="435" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">7</text>
<path d="M522 455 V758" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="578" y="435" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">8</text>
<path d="M578 455 V758" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="70" y="435" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">格点</text>
<text x="70" y="501" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">36</text>
<rect x="132" y="470" width="444" height="48" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="354.0" y="502" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">8 格</text>
<text x="70" y="576" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">48</text>
<rect x="132" y="545" width="220" height="48" rx="5" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="242.0" y="577" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">4 格</text>
<rect x="356" y="545" width="164" height="48" rx="5" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="438.0" y="577" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">3 格</text>
<text x="70" y="651" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">52</text>
<rect x="244" y="620" width="108" height="48" rx="5" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="298.0" y="652" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">2 格</text>
<text x="70" y="726" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">55</text>
<rect x="132" y="695" width="108" height="48" rx="5" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="186.0" y="727" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">2 格</text>
<text x="320" y="810" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">每格 120 ticks · 两拍共 960 ticks</text>
<path d="M320 838 V875" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="60" y="875" width="520" height="95" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="320.0" y="913.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">原旋律 + 上方四个音 + 持续低音</text>
<text x="320.0" y="947.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">保留速度、拍号、调号和 PPQ</text>
<text x="320" y="1020" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">蓝色为规则低音，绿色为模型节奏</text>
</g>
</svg>
