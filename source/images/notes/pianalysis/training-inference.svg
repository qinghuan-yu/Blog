<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">Pianalysis：训练与生成分两条路</title>
<desc id="desc">训练从完整MIDI经过增强Skyline与DP弱标注、旋律伴奏拆分、窗口编码训练条件语言模型；生成时输入旋律形成prompt，模型续写伴奏、解码，与原始旋律合并。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">Pianalysis：训练与生成分两条路</text>
<text x="30" y="95" font-size="26" fill="#243247" text-anchor="start" font-weight="600">① 离线训练</text>
<rect x="120" y="120" width="400" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="158.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">完整 MIDI 数据集</text>
<path d="M320 180 V220" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="100" y="220" width="440" height="85" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="254.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">增强 Skyline + DP</text>
<text x="320.0" y="286.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">抽取旋律，拆分伴奏</text>
<path d="M320 305 V345" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="100" y="345" width="440" height="85" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="379.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">窗口编码</text>
<text x="320.0" y="411.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">旋律条件 + 伴奏目标</text>
<path d="M320 430 V470" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="100" y="470" width="440" height="85" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="504.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">GPT-2 条件语言模型</text>
<text x="320.0" y="536.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">学习续写伴奏</text>
<text x="30" y="620" font-size="26" fill="#243247" text-anchor="start" font-weight="600">② 在线生成</text>
<rect x="30" y="650" width="220" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="140.0" y="690.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">用户旋律 MIDI</text>
<rect x="370" y="650" width="240" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="490.0" y="690.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">旋律 prompt</text>
<path d="M250 682 H370" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M490 714 V755" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="370" y="755" width="240" height="85" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="490.0" y="789.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">模型续写</text>
<text x="490.0" y="821.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">伴奏 token</text>
<path d="M490 840 V880" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="370" y="880" width="240" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="490.0" y="920.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">解码伴奏 MIDI</text>
<path d="M140 714 V980 H320" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="150" y="870" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">原始旋律</text>
<text x="150" y="902" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">直接保留</text>
<path d="M490 944 V980 H320" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M320 980 V1010" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="320" y="1052" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">最终 MIDI = 原旋律 + 生成伴奏</text>
</g>
</svg>
