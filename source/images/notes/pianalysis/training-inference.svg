<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1370" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">V5：训练与生成</title><desc id="desc">训练时将 POP909 的真实 PIANO 节奏投影到三条音级通道，用参考历史和参考密度标签训练 V5。生成时由调用者给定密度，冻结的 V3 预测音高，V5 预测起音和细节，映射后与原旋律合并。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="44" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">V5：训练与生成</text>
<text x="320" y="86" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">冻结配位与可控节奏相结合</text>
<rect x="60" y="120" width="520" height="95" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="158.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">POP909 命名轨</text>
<text x="320.0" y="192.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">旋律 · PIANO · 和声与拍点</text>
<path d="M320 215 V250" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="60" y="250" width="520" height="95" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="288.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">真实伴奏的三通道投影</text>
<text x="320.0" y="322.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">起音 · 时值 · 相对力度</text>
<path d="M320 345 V380" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="60" y="380" width="520" height="100" rx="8" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="421.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">训练 V5 节奏模型</text>
<text x="320.0" y="455.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">参考历史 + 参考密度标签</text>
<text x="320" y="540" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">生成时，逐个和声段处理</text>
<rect x="60" y="575" width="520" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="320.0" y="616.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">旋律 + 全局和声计划</text>
<text x="320.0" y="650.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">调用者指定 sparse / medium / dense</text>
<path d="M320 675 V710 H170 V745" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M320 710 H470 V745" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="40" y="745" width="260" height="110" rx="8" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="170.0" y="774.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">冻结 V3 配位</text>
<text x="170.0" y="808.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">和弦与旋律概况</text>
<text x="170.0" y="842.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">上一组配位</text>
<rect x="340" y="745" width="260" height="110" rx="8" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="470.0" y="774.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">V5 节奏</text>
<text x="470.0" y="808.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">旋律格点与密度</text>
<text x="470.0" y="842.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">上一段起音模式</text>
<path d="M170 855 V895" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M470 855 V895" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="40" y="895" width="260" height="95" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="170.0" y="933.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">一个低音</text>
<text x="170.0" y="967.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">三个上方音高</text>
<rect x="340" y="895" width="260" height="95" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="470.0" y="933.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">整段起音 mask</text>
<text x="470.0" y="967.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">随后生成时值力度</text>
<path d="M170 990 V1020 H320" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M470 990 V1020 H320 V1055" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="60" y="1055" width="520" height="95" rx="8" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="1093.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">通道映射为具体音高</text>
<text x="320.0" y="1127.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">局部格点换算为全局 tick</text>
<path d="M320 1150 V1190" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="60" y="1190" width="520" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="320.0" y="1231.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">补入规则持续低音</text>
<text x="320.0" y="1265.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">合并原旋律，导出 MIDI</text>
<text x="320" y="1333" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">模型学习相对力度，规则安排整体音量</text>
</g>
</svg>
