<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1070" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">从音符时间到 delta-time token</title>
<desc id="desc">例子为旋律音高60力度80，第一音0到0.2秒，第二音0.2到0.35秒，quantum为10毫秒。tick依次0、20、35；tick20先NOTE_OFF后NOTE_ON，时间增量为20和15。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">从音符时间到 delta-time token</text>
<text x="320" y="84" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">例：音高 60，力度 80，1 tick = 10 ms</text>
<text x="30" y="135" font-size="26" fill="#243247" text-anchor="start" font-weight="600">① 钢琴卷帘：同音连续两次起音</text>
<path d="M80 285 L570 285" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<path d="M100 170 L100 292" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/>
<text x="100" y="326" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">0 s</text>
<path d="M340 170 L340 292" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/>
<text x="340" y="326" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">0.20 s</text>
<path d="M520 170 L520 292" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/>
<text x="520" y="326" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">0.35 s</text>
<rect x="100" y="195" width="240" height="62" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="220.0" y="234.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">音符 1</text>
<rect x="340" y="195" width="180" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="430.0" y="234.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">音符 2</text>
<text x="30" y="385" font-size="26" fill="#243247" text-anchor="start" font-weight="600">② 同一 tick：先关音，再开音</text>
<text x="110" y="454" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">tick 0</text>
<rect x="215" y="420" width="395" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="412.5" y="458.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">ON(60,80)</text>
<text x="110" y="534" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">tick 20</text>
<rect x="215" y="500" width="395" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="412.5" y="538.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">OFF(60) → ON(60,80)</text>
<text x="110" y="614" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">tick 35</text>
<rect x="215" y="580" width="395" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="412.5" y="618.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">OFF(60)</text>
<text x="30" y="700" font-size="26" fill="#243247" text-anchor="start" font-weight="600">③ 时间差转成 token</text>
<text x="320" y="740" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">起点</text>
<text x="320" y="778" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">[10, 60, 80]</text>
<text x="320" y="820" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">推进 20 ticks</text>
<text x="320" y="858" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">[4,20] [11,60] [10,60,80]</text>
<text x="320" y="900" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">再推进 15 ticks</text>
<text x="320" y="938" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">[4,15] [11,60]</text>
<text x="320" y="1030" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">20 + 15 = 35 ticks = 350 ms</text>
</g>
</svg>
