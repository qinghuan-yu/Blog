<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">V5：先起音，后时值</title><desc id="desc">八格起音 mask 为 5、0、2、0、1、0、0、0。第零格根与五音一起起音，第二格三音起音，第四格根音再次起音。根音第一事件的时值上限为四格，其余按下一同通道起音或段末限制。四个起音占两拍，训练密度为 sparse。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="44" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">V5：先起音，后时值</text>
<text x="320" y="86" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">两拍 C 大三和弦 · 每拍四格</text>
<text x="320" y="140" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">阶段一：先确定全部起音</text>
<text x="138" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<rect x="113" y="212" width="50" height="50" rx="8" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="138" y="245" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">5</text>
<text x="198" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">1</text>
<rect x="173" y="212" width="50" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="198" y="245" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<text x="258" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">2</text>
<rect x="233" y="212" width="50" height="50" rx="8" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="258" y="245" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">2</text>
<text x="318" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">3</text>
<rect x="293" y="212" width="50" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="318" y="245" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<text x="378" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">4</text>
<rect x="353" y="212" width="50" height="50" rx="8" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="378" y="245" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">1</text>
<text x="438" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">5</text>
<rect x="413" y="212" width="50" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="438" y="245" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<text x="498" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">6</text>
<rect x="473" y="212" width="50" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="498" y="245" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<text x="558" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">7</text>
<rect x="533" y="212" width="50" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="558" y="245" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<text x="62" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">格点</text>
<text x="62" y="245" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">mask</text>
<text x="320" y="308" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">5 = 根音 + 五音；0 = 没有新起音</text>
<path d="M320 335 V380" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="320" y="425" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">阶段二：逐个事件选择时值</text>
<path d="M110 455 V650" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<path d="M170 455 V650" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<path d="M230 455 V650" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<path d="M290 455 V650" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<path d="M350 455 V650" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<path d="M410 455 V650" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<path d="M470 455 V650" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<path d="M530 455 V650" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<path d="M590 455 V650" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="62" y="503" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">根音</text>
<rect x="112" y="475" width="236" height="42" rx="5" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="230.0" y="504" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">4 格</text>
<rect x="352" y="475" width="176" height="42" rx="5" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="440.0" y="504" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">3 格</text>
<text x="62" y="568" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">三音</text>
<rect x="232" y="540" width="116" height="42" rx="5" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="290.0" y="569" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">2 格</text>
<text x="62" y="633" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">五音</text>
<rect x="112" y="605" width="116" height="42" rx="5" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="170.0" y="634" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">2 格</text>
<rect x="60" y="700" width="520" height="95" rx="8" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="738.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">第 0 格根音：下一起音在第 4 格</text>
<text x="320.0" y="772.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">时值候选为 1、2、3、4 格</text>
<rect x="60" y="825" width="520" height="95" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="863.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">其他事件按同一规则计算上限</text>
<text x="320.0" y="897.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">无后续起音时，以第 8 格段末为界</text>
<text x="320" y="970" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">时值可以提前结束，也可以延续到上限</text>
<text x="320" y="1020" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">4 个上方起音 ÷ 2 拍 = 2 → sparse</text>
</g>
</svg>
