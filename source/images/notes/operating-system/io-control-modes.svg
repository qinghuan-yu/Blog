<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1110" data-layout="compact" role="img" aria-labelledby="title desc">
  <title id="title">I/O 控制：谁等待，谁搬运，谁组织</title>
  <desc id="desc">轮询中CPU反复查询设备状态并参与搬运；中断方式由设备通知CPU就绪，CPU再处理数据；DMA由控制器在设备与内存之间批量传送，CPU启动和收尾；通道执行I/O程序，组织多个设备传输。</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
  </defs>
  <g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
    <text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">I/O 控制：谁等待，谁搬运，谁组织</text>
    <text x="30" y="110" font-size="26" fill="#243247" text-anchor="start" font-weight="600">① 轮询</text>
    <text x="30" y="350" font-size="26" fill="#243247" text-anchor="start" font-weight="600">② 中断</text>
    <text x="30" y="590" font-size="26" fill="#243247" text-anchor="start" font-weight="600">③ DMA</text>
    <text x="30" y="830" font-size="26" fill="#243247" text-anchor="start" font-weight="600">④ 通道</text>
    <rect x="35" y="140" width="150" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="110.0" y="188.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">CPU</text>
    <rect x="405" y="140" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="505.0" y="188.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">设备控制器</text>
    <path d="M185 158 H405" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
    <text x="295" y="148" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">查询状态</text>
    <path d="M405 203 H185" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
    <text x="295" y="241" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">未就绪再查询</text>
    <text x="320" y="290" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">就绪后，CPU 参与数据搬运</text>
    <rect x="35" y="380" width="150" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="110.0" y="428.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">CPU</text>
    <rect x="405" y="380" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="505.0" y="428.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">设备控制器</text>
    <path d="M185 398 H405" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
    <text x="295" y="388" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">发出命令</text>
    <path d="M405 443 H185" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="295" y="482" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">就绪中断</text>
    <text x="320" y="530" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">CPU 等待期间可执行其他任务</text>
    <rect x="20" y="635" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="95.0" y="678.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">设备</text>
    <rect x="245" y="635" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="320.0" y="678.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">DMA</text>
    <rect x="470" y="635" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="545.0" y="678.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">内存</text>
    <path d="M170 670 H245" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <path d="M395 670 H470" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="320" y="752" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">CPU 配置 → DMA 批量搬运 → 完成中断</text>
    <rect x="30" y="860" width="150" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="105.0" y="908.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">CPU</text>
    <rect x="270" y="860" width="220" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="380.0" y="908.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">通道程序</text>
    <path d="M180 900 H270" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
    <path d="M380 940 V975 H160 V1000" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <path d="M380 975 H500 V1000" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <rect x="55" y="1000" width="210" height="70" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="160.0" y="1043.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">设备 A</text>
    <rect x="395" y="1000" width="210" height="70" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="500.0" y="1043.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">设备 B</text>
  </g>
</svg>
