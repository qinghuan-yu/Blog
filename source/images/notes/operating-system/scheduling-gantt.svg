<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" data-layout="compact" role="img" aria-labelledby="title desc">
  <title id="title">调度甘特图：先排时间，再算周转</title>
  <desc id="desc">四个作业均在0到达，按非抢占优先级顺序P2、P1、P4、P3执行，服务时间分别6、8、4、12，完成时刻6、14、18、30。平均周转时间17，平均带权周转时间2.4375。</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
  </defs>
  <g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
    <text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">调度甘特图：先排时间，再算周转</text>
    <text x="320" y="84" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">均在 0 到达 · 非抢占优先级调度</text>
    <text x="320" y="125" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">执行顺序：P2 → P1 → P4 → P3</text>
    <text x="40" y="180" font-size="24" fill="#243247" text-anchor="start" font-weight="500">CPU</text>
    <rect x="50" y="210" width="108" height="90" rx="0" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="104.0" y="250" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="600">P2</text>
    <text x="104.0" y="282" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">6</text>
    <rect x="158" y="210" width="144" height="90" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="230.0" y="250" font-size="26" fill="#64748b" text-anchor="middle" font-weight="600">P1</text>
    <text x="230.0" y="282" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">8</text>
    <rect x="302" y="210" width="72" height="90" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="338.0" y="250" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="600">P4</text>
    <text x="338.0" y="282" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">4</text>
    <rect x="374" y="210" width="216" height="90" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="482.0" y="250" font-size="26" fill="#64748b" text-anchor="middle" font-weight="600">P3</text>
    <text x="482.0" y="282" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">12</text>
    <path d="M50 300 V313" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="50" y="343" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">0</text>
    <path d="M158 300 V313" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="158" y="343" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">6</text>
    <path d="M302 300 V313" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="302" y="343" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">14</text>
    <path d="M374 300 V313" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="374" y="343" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">18</text>
    <path d="M590 300 V313" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="590" y="343" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">30</text>
    <text x="320" y="389" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">完成时刻 = 周转时间（本例到达时刻为 0）</text>
    <text x="320" y="441" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">平均周转：(6 + 14 + 18 + 30) / 4 = 17</text>
    <text x="320" y="492" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">带权周转：1，1.75，4.5，2.5</text>
    <text x="320" y="544" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="600">平均带权周转 = 2.4375</text>
    <text x="320" y="591" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">每块宽度与服务时间成比例</text>
  </g>
</svg>
