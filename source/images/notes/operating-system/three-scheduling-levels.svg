<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 875" data-layout="compact" role="img" aria-labelledby="title desc">
  <title id="title">三级调度：进入内存、换入换出、上 CPU</title>
  <desc id="desc">高级调度从后备作业中选择进入内存的任务；中级调度在内存进程与磁盘挂起区之间换出换入；低级调度从内存就绪队列选择任务分派CPU。</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
  </defs>
  <g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
    <text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">三级调度：进入内存、换入换出、上 CPU</text>
    <rect x="140" y="105" width="360" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="320.0" y="153.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">后备作业 · 磁盘</text>
    <path d="M320 185 V265" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="455" y="229" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">高级：接纳作业</text>
    <rect x="50" y="265" width="540" height="245" rx="10" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="320" y="307" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">内存中的进程</text>
    <rect x="90" y="342" width="200" height="82" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="190.0" y="391.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">就绪队列</text>
    <rect x="350" y="342" width="200" height="82" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="450.0" y="391.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">阻塞队列</text>
    <path d="M540 510 V700" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
    <text x="579" y="608" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">换出</text>
    <path d="M420 700 V510" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
    <text x="380" y="608" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">换入</text>
    <path d="M190 424 V700" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <rect x="40" y="700" width="240" height="105" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="160.0" y="744.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">低级调度</text>
    <text x="160.0" y="777.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">分派到 CPU</text>
    <rect x="360" y="700" width="240" height="105" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="480.0" y="744.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">中级调度</text>
    <text x="480.0" y="777.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">磁盘挂起区</text>
    <text x="320" y="853" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">就绪任务竞争 CPU；挂起任务等待换入</text>
  </g>
</svg>
