<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 930" data-layout="compact" role="img" aria-labelledby="title desc">
  <title id="title">FIFO 与 LRU：命中会不会改变顺序？</title>
  <desc id="desc">三个页框访问7、0、1、2、0、3。FIFO与LRU前五步相同：读2换出7，读0命中。最后读3时，FIFO换出最早装入的0，得到2、3、1；LRU换出最近最久未访问的1，得到2、0、3。两者本序列均缺页5次。</desc>
