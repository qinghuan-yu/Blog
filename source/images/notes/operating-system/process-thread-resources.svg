<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 850" data-layout="compact" role="img" aria-labelledby="title desc">
  <title id="title">进程与线程：哪些共享，哪些独有？</title>
  <desc id="desc">进程A与进程B拥有各自的地址空间。进程A内线程1和线程2共享代码、数据和打开的文件，每个线程分别保留TCB、PC、寄存器和栈。CPU以线程作为调度单位。</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
  </defs>
  <g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
    <text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">进程与线程：哪些共享，哪些独有？</text>
    <rect x="30" y="105" width="580" height="480" rx="10" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="320" y="150" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">进程 A · 独立地址空间</text>
    <rect x="60" y="185" width="520" height="90" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="320.0" y="238.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">共享：代码、数据、打开的文件</text>
    <rect x="60" y="325" width="245" height="220" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="182.5" y="367" font-size="28" fill="#2563eb" text-anchor="middle" font-weight="600">线程 1</text>
    <text x="182.5" y="414" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">TCB / PC</text>
    <text x="182.5" y="457" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">寄存器</text>
    <text x="182.5" y="500" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">独立栈</text>
    <path d="M182.5 325 V275" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <rect x="335" y="325" width="245" height="220" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="457.5" y="367" font-size="28" fill="#2563eb" text-anchor="middle" font-weight="600">线程 2</text>
    <text x="457.5" y="414" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">TCB / PC</text>
    <text x="457.5" y="457" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">寄存器</text>
    <text x="457.5" y="500" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">独立栈</text>
    <path d="M457.5 325 V275" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <rect x="30" y="625" width="580" height="125" rx="10" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="320" y="667" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">进程 B · 另一套地址空间</text>
    <text x="320" y="714" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">代码、数据、文件与线程状态归 B 管理</text>
    <text x="320" y="807" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">进程组织资源；线程接受 CPU 调度</text>
  </g>
</svg>
