<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 745" data-layout="compact" role="img" aria-labelledby="title desc">
  <title id="title">挂起：驻留位置与等待状态分开看</title>
  <desc id="desc">驻留内存的就绪或阻塞进程挂起后，分别成为静止就绪或静止阻塞；激活后反向返回。等待事件完成时，内存阻塞回到内存就绪，静止阻塞变为静止就绪，仍需换入内存。</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
  </defs>
  <g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
    <text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">挂起：驻留位置与等待状态分开看</text>
    <text x="320" y="104" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">驻留内存</text>
    <rect x="60" y="145" width="200" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="160.0" y="203.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">就绪</text>
    <rect x="380" y="145" width="200" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="480.0" y="203.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">阻塞</text>
    <path d="M380 195 H260" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="320" y="174" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">事件发生</text>
    <text x="320" y="457" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">换出到磁盘</text>
    <rect x="60" y="495" width="200" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160.0" y="553.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">静止就绪</text>
    <rect x="380" y="495" width="200" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="480.0" y="553.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">静止阻塞</text>
    <path d="M380 545 H260" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="320" y="524" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">事件发生</text>
    <path d="M105 245 V495" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
    <path d="M215 495 V245" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="160" y="336" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">挂起</text>
    <text x="160" y="381" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">激活</text>
    <path d="M425 245 V495" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
    <path d="M535 495 V245" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="480" y="336" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">挂起</text>
    <text x="480" y="381" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">激活</text>
    <text x="320" y="659" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">静止阻塞 → 静止就绪：事件已完成</text>
    <text x="320" y="703" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">静止就绪 → 就绪：换入内存后参与调度</text>
  </g>
</svg>
