<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 710" data-layout="compact" role="img" aria-labelledby="title desc">
  <title id="title">死锁：各拿一件，又等另一件</title>
  <desc id="desc">任务A持有炒锅并请求锅铲；任务B持有锅铲并请求炒锅。炒锅和锅铲各只有一件，资源到任务的青绿色边表示已分配，任务到资源的灰色边表示申请，形成环路。</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
  </defs>
  <g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
    <text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">死锁：各拿一件，又等另一件</text>
    <text x="320" y="84" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">炒锅 1 口 · 锅铲 1 把</text>
    <path d="M210 200 H410" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
    <text x="320" y="178" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">申请锅铲</text>
    <path d="M500 255 V395" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="556" y="336" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">持有</text>
    <path d="M430 460 H230" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
    <text x="320" y="501" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">申请炒锅</text>
    <path d="M140 405 V270" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="80" y="342" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">持有</text>
    <circle cx="140" cy="200" r="70" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="140" y="208" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="600">任务 A</text>
    <rect x="410" y="145" width="180" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="500.0" y="208.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">锅铲</text>
    <circle cx="500" cy="460" r="70" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="500" y="468" font-size="28" fill="#2563eb" text-anchor="middle" font-weight="600">任务 B</text>
    <rect x="50" y="405" width="180" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="140.0" y="468.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">炒锅</text>
    <text x="320" y="585" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">A 等 B 释放锅铲；B 等 A 释放炒锅</text>
    <path d="M65 630 H145" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="340" y="638" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">资源 → 任务：已分配</text>
    <path d="M65 678 H145" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
    <text x="340" y="686" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">任务 → 资源：申请</text>
  </g>
</svg>
