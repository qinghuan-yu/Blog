<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" data-layout="compact" role="img" aria-labelledby="title desc">
  <title id="title">进程的三个基本状态</title>
  <desc id="desc">就绪态经调度进入运行态；运行态因时间片用完或被抢占回到就绪态，因等待 I/O 或其他事件进入阻塞态；阻塞态在等待事件发生后回到就绪态，而不是直接运行。</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
    <text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">进程的三个基本状态</text>
    <text x="320" y="83" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">等 CPU 与等事件，是两种不同的等待</text>
    <!-- 状态节点：就绪与运行同层，阻塞置于下一层。 -->
    <rect x="45" y="155" width="190" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="140" y="198" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">就绪态</text>
    <text x="140" y="234" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">只等 CPU</text>
    <rect x="405" y="155" width="190" height="100" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="500" y="198" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">运行态</text>
    <text x="500" y="234" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">正在执行</text>
    <rect x="225" y="420" width="190" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="320" y="463" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">阻塞态</text>
    <text x="320" y="499" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">等待事件</text>
    <!-- 调度与抢占分别画线，避免双向箭头含义混淆。 -->
    <path d="M235 180 H405" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="320" y="164" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">调度</text>
    <path d="M405 230 H340 V305 H140 V255" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
    <text x="258" y="340" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">时间片用完 / 被抢占</text>
    <path d="M500 255 H610 V470 H415" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
    <text x="515" y="376" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">等待 I/O</text>
    <text x="515" y="407" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">或其他事件</text>
    <path d="M225 470 H78 V255" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="145" y="393" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">事件发生</text>
    <text x="320" y="567" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">事件完成 → 就绪 → 再获调度才运行</text>
  </g>
</svg>
