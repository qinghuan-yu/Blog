<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" data-layout="compact" role="img" aria-labelledby="title desc">
  <title id="title">单双缓冲：把等待变成重叠工作</title>
  <desc id="desc">单缓冲中设备填充与进程取走数据交替使用同一个缓冲区。双缓冲在第一轮设备写A时进程读B，双方完成后第二轮设备写B、进程读A，两块缓冲区交换读写角色。</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
  </defs>
  <g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
    <text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">单双缓冲：把等待变成重叠工作</text>
    <text x="30" y="105" font-size="26" fill="#243247" text-anchor="start" font-weight="600">① 单缓冲：共用一个中转区</text>
    <rect x="30" y="145" width="150" height="75" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="105.0" y="190.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">设备</text>
    <rect x="250" y="145" width="140" height="75" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="320.0" y="190.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">缓冲区</text>
    <rect x="460" y="145" width="150" height="75" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="535.0" y="190.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">进程</text>
    <path d="M180 182 H250" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <path d="M390 182 H460" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
    <rect x="80" y="260" width="240" height="65" rx="0" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="200" y="301" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">设备填充</text>
    <rect x="320" y="260" width="240" height="65" rx="0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="301" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">进程取走</text>
    <path d="M80 347 H560" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
    <text x="320" y="386" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">同一缓冲区交替使用 → 时间</text>
    <text x="30" y="450" font-size="26" fill="#243247" text-anchor="start" font-weight="600">② 双缓冲：两个中转区交换角色</text>
    <text x="50" y="510" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">轮次</text>
    <text x="235" y="510" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">缓冲 A</text>
    <text x="485" y="510" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">缓冲 B</text>
    <text x="50" y="587" font-size="26" fill="#64748b" text-anchor="middle" font-weight="500">1</text>
    <rect x="135" y="545" width="200" height="65" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="235.0" y="585.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">设备写入</text>
    <rect x="385" y="545" width="200" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="485.0" y="585.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">进程读取</text>
    <text x="50" y="697" font-size="26" fill="#64748b" text-anchor="middle" font-weight="500">2</text>
    <rect x="135" y="655" width="200" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="235.0" y="695.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">进程读取</text>
    <rect x="385" y="655" width="200" height="65" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="485.0" y="695.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">设备写入</text>
    <path d="M320 610 V649" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
    <text x="320" y="765" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">双方完成后交换：写一块，同时读另一块</text>
  </g>
</svg>
