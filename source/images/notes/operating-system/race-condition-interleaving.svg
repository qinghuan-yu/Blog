<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1090" data-layout="compact" role="img" aria-labelledby="title desc">
  <title id="title">竞态交错：两次扣血，只扣了一次</title>
  <desc id="desc">沿时间向下：时刻1线程A读取1000；时刻2切到B并保存A的寄存器1000；时刻3线程B也读取1000；时刻4线程B减100并写回900；时刻5切回A并恢复旧寄存器1000；时刻6线程A用旧值减100，再写回900。最终共享Boss_HP为900而非800，线程B的更新丢失。</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
    <text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">竞态交错：两次扣血，只扣了一次</text>
    <text x="320" y="82" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">同一 CPU 上交错执行 · 每次扣 100</text>
    <rect x="30" y="110" width="580" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="320" y="150" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">共享内存 Boss_HP 初值 = 1000</text>
    <text x="80" y="214" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">时刻</text>
    <text x="235" y="214" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="600">线程 A</text>
    <text x="415" y="214" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="600">线程 B</text>
    <text x="565" y="214" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">内存</text>
    <path d="M80 240 V900" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
    <path d="M235 240 V900" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8"/>
    <path d="M415 240 V900" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8"/>
    <path d="M565 240 V900" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 8"/>
    <rect x="532" y="254" width="66" height="36" fill="#fbfbf9"/>
    <rect x="532" y="434" width="66" height="36" fill="#fbfbf9"/>
    <rect x="532" y="602" width="66" height="36" fill="#fbfbf9"/>
    <rect x="532" y="857" width="66" height="36" fill="#fbfbf9"/>
    <circle cx="80" cy="275" r="21" fill="white" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="283" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">1</text>
    <circle cx="80" cy="365" r="21" fill="white" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="373" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">2</text>
    <circle cx="80" cy="455" r="21" fill="white" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="463" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">3</text>
    <circle cx="80" cy="575" r="21" fill="white" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="583" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">4</text>
    <circle cx="80" cy="715" r="21" fill="white" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="723" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">5</text>
    <circle cx="80" cy="845" r="21" fill="white" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="853" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">6</text>
    <rect x="148" y="240" width="174" height="76" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="235" y="270" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">读入</text>
    <text x="235" y="301" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">1000</text>
    <text x="565" y="284" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">1000</text>
    <path d="M530 279 H322" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <rect x="145" y="337" width="345" height="68" rx="10" fill="white" stroke="#64748b" stroke-width="2"/>
    <text x="317" y="366" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">切到 B，保存 A 的旧值</text>
    <text x="317" y="394" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">A 的寄存器仍为 1000</text>
    <rect x="328" y="420" width="174" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="415" y="450" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">读入</text>
    <text x="415" y="481" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="500">1000</text>
    <text x="565" y="464" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">1000</text>
    <path d="M530 459 H502" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
    <rect x="328" y="530" width="174" height="118" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="415" y="562" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">减 100</text>
    <text x="415" y="597" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">1000 → 900</text>
    <text x="415" y="632" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">写回</text>
    <path d="M502 623 H528" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/>
    <text x="565" y="632" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="600">900</text>
    <rect x="145" y="681" width="345" height="68" rx="10" fill="white" stroke="#64748b" stroke-width="2"/>
    <text x="317" y="710" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">切回 A，恢复旧寄存器</text>
    <text x="317" y="738" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">恢复 1000，不重读内存</text>
    <rect x="148" y="785" width="174" height="118" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="235" y="817" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">减 100</text>
    <text x="235" y="852" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">1000 → 900</text>
    <text x="235" y="887" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">写回</text>
    <path d="M322 878 H528" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
    <text x="565" y="887" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="600">900</text>
    <rect x="30" y="940" width="580" height="74" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
    <text x="320" y="972" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="600">最终 900 ≠ 期望 800</text>
    <text x="320" y="1002" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">A 基于旧值写回，覆盖了 B 的更新</text>
    <text x="320" y="1054" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">互斥保护整个“读 → 减 → 写”临界区</text>
  </g>
</svg>
