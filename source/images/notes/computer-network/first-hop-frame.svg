<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 615" role="img" aria-labelledby="title desc"><title id="title">第一跳：电脑 A → R1</title><desc id="desc">帧中的以太网MAC负责当前交付，IP和TCP端口保持通信两端的信息，尾部校验对应新帧。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">第一跳：电脑 A → R1</text><rect x="70" y="105" width="940" height="85" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="205" y="156" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="500">以太网首部</text><text x="659" y="156" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="500">源 MAC：A     →     目的 MAC：R1-入</text><rect x="70" y="190" width="940" height="85" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="205" y="241" font-size="22" fill="#64748b" text-anchor="middle" font-weight="500">IP 首部</text><text x="659" y="241" font-size="23" fill="#64748b" text-anchor="middle" font-weight="500">192.168.1.10     →     10.0.2.8</text><rect x="70" y="275" width="940" height="85" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="205" y="326" font-size="22" fill="#0d9488" text-anchor="middle" font-weight="500">TCP 首部</text><text x="659" y="326" font-size="23" fill="#0d9488" text-anchor="middle" font-weight="500">源端口 50000     →     目的端口 443</text><rect x="70" y="360" width="940" height="85" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="205" y="411" font-size="22" fill="#243247" text-anchor="middle" font-weight="500">数据</text><text x="659" y="411" font-size="23" fill="#243247" text-anchor="middle" font-weight="500">TLS 保护后的应用数据</text><rect x="70" y="445" width="940" height="85" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="205" y="496" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="500">以太网尾部</text><text x="659" y="496" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="500">本链路帧的校验信息</text><text x="540" y="575" font-size="21" fill="#64748b" text-anchor="middle" font-weight="500">当前 TTL = 64；下一台路由器转发时递减</text></g></svg>
