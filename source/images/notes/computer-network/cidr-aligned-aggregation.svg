<text x="215" y="494" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">10</text>
<rect x="250" y="450" width="70" height="70" rx="0" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="285" y="494" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">11</text>
<rect x="320" y="450" width="70" height="70" rx="0" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="355" y="494" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">12</text>
<rect x="390" y="450" width="70" height="70" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="425" y="494" font-size="26" fill="#64748b" text-anchor="middle" font-weight="500">13</text>
<rect x="460" y="450" width="70" height="70" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="495" y="494" font-size="26" fill="#64748b" text-anchor="middle" font-weight="500">14</text>
<rect x="530" y="450" width="70" height="70" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="565" y="494" font-size="26" fill="#64748b" text-anchor="middle" font-weight="500">15</text>
<path d="M40 539 V554 H320 V539" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="180" y="588" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">192.168.8.0/22</text>
<path d="M320 539 V554 H600 V539" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="460" y="588" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">192.168.12.0/22</text>
<path d="M40 635 V653 H600 V635" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="320" y="692" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="500">最小单前缀覆盖：192.168.8.0/21</text>
<text x="320" y="738" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">/21 还覆盖 8、13、14、15 这四个 /24</text>
<text x="320" y="780" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">发布汇总前，核对整个覆盖范围的转发方向</text>
</g>
</svg>
