<text x="145" y="229" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">9</text>
<rect x="180" y="185" width="70" height="70" rx="0" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="215" y="229" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">10</text>
<rect x="250" y="185" width="70" height="70" rx="0" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="285" y="229" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">11</text>
<rect x="320" y="185" width="70" height="70" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="355" y="229" font-size="26" fill="#64748b" text-anchor="middle" font-weight="500">12</text>
<rect x="390" y="185" width="70" height="70" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="425" y="229" font-size="26" fill="#64748b" text-anchor="middle" font-weight="500">13</text>
<rect x="460" y="185" width="70" height="70" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="495" y="229" font-size="26" fill="#64748b" text-anchor="middle" font-weight="500">14</text>
<rect x="530" y="185" width="70" height="70" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="565" y="229" font-size="26" fill="#64748b" text-anchor="middle" font-weight="500">15</text>
<path d="M40 274 V289 H320 V274" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="180" y="323" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">192.168.8.0/22</text>
<path d="M320 274 V289 H600 V274" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="460" y="323" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">192.168.12.0/22</text>
<text x="30" y="420" font-size="26" fill="#243247" text-anchor="start" font-weight="600">9、10、11、12：跨过 /22 边界</text>
