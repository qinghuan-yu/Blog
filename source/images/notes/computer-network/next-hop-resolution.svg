<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 840" role="img" aria-labelledby="title desc"><title id="title">先确定交给谁，再解析它的 MAC</title><desc id="desc">主机判断本地目标或默认网关后查询对应ARP缓存；命中直接取得MAC，未命中广播查询，再封装发送。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">先确定交给谁，再解析它的 MAC</text><rect x="370" y="95" width="340" height="65" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="540.0" y="135.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">目标在本地子网？</text><rect x="65" y="225" width="390" height="75" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="260.0" y="270.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">下一跳 = 目标主机</text><rect x="625" y="225" width="390" height="75" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="820.0" y="270.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">下一跳 = 默认网关</text><path d="M430 160 V195 H260 V225" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="340" y="185" font-size="21" fill="#0d9488" text-anchor="middle" font-weight="500">是</text><path d="M650 160 V195 H820 V225" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="740" y="185" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">否</text><path d="M260 300 V340 H540" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M820 300 V340 H540" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M540 340 V385" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><circle cx="540" cy="340" r="4" fill="#64748b"/><rect x="335" y="385" width="410" height="75" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="540.0" y="430.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">查询下一跳的 ARP 缓存</text><path d="M745 423 H940 V620 H745" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="864" y="409" font-size="21" fill="#0d9488" text-anchor="middle" font-weight="500">命中</text><path d="M540 460 V495" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="588" y="487" font-size="19" fill="#243247" text-anchor="middle" font-weight="500">未命中</text><rect x="335" y="495" width="410" height="65" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="540.0" y="535.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">在本地链路发起 ARP 查询</text><path d="M540 560 V590" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><rect x="335" y="590" width="410" height="65" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="540.0" y="630.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">获得下一跳 MAC</text><path d="M540 655 V690" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><rect x="335" y="690" width="410" height="65" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="540.0" y="730.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">封装并发送以太网帧</text><text x="540" y="807" font-size="20" fill="#64748b" text-anchor="middle" font-weight="500">本图采用只有直连路由和默认路由的主机配置</text></g></svg>
