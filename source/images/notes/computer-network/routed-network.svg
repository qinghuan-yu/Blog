<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 475" role="img" aria-labelledby="title desc"><title id="title">实验网络：三条链路，两次路由转发</title><desc id="desc">电脑A与R1位于192.168.1.0/24，R1与R2由10.0.12.0/30互联，R2与服务器位于10.0.2.0/24。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="570.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">实验网络：三条链路，两次路由转发</text><rect x="45" y="160" width="150" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="120.0" y="218.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">电脑 A</text><rect x="345" y="160" width="150" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="420.0" y="218.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">R1</text><rect x="645" y="160" width="150" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="720.0" y="218.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">R2</text><rect x="945" y="160" width="150" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="1020.0" y="218.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">服务器 S</text><path d="M195 210 H345" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><path d="M495 210 H645" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><path d="M795 210 H945" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="120" y="300" font-size="19" fill="#243247" text-anchor="middle" font-weight="500">192.168.1.10/24</text><text x="420" y="125" font-size="18" fill="#243247" text-anchor="middle" font-weight="500">入口：192.168.1.1/24</text><text x="420" y="300" font-size="18" fill="#243247" text-anchor="middle" font-weight="500">出口：10.0.12.1/30</text><text x="720" y="125" font-size="18" fill="#243247" text-anchor="middle" font-weight="500">入口：10.0.12.2/30</text><text x="720" y="300" font-size="18" fill="#243247" text-anchor="middle" font-weight="500">出口：10.0.2.1/24</text><text x="1020" y="300" font-size="19" fill="#243247" text-anchor="middle" font-weight="500">10.0.2.8/24</text><text x="270" y="240" font-size="18" fill="#0d9488" text-anchor="middle" font-weight="500">链路 1</text><text x="570" y="240" font-size="18" fill="#0d9488" text-anchor="middle" font-weight="500">链路 2</text><text x="870" y="240" font-size="18" fill="#0d9488" text-anchor="middle" font-weight="500">链路 3</text><text x="120" y="361" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">源端口 50000</text><text x="1020" y="361" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">目的端口 443</text><text x="570" y="427" font-size="22" fill="#64748b" text-anchor="middle" font-weight="500">源、目的 IP 与端口贯穿全程；每条链路使用各自的 MAC 封装</text></g></svg>
