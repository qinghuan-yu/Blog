<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1010" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">VLSM：按容量切开一个 /24</title>
<desc id="desc">192.168.10.0/24 按地址数依次分配 A /25、B /26、C /27、D /28，余下 /28 留作扩展；长度按128、64、32、16、16个地址成比例。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">VLSM：按容量切开一个 /24</text>
<text x="320" y="84" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">地址池 192.168.10.0/24</text>
<rect x="64" y="140" width="256" height="66" rx="0" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="192.0" y="182" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">A</text>
<rect x="320" y="140" width="128" height="66" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="384.0" y="182" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">B</text>
<rect x="448" y="140" width="64" height="66" rx="0" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="480.0" y="182" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">C</text>
<rect x="512" y="140" width="32" height="66" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="528.0" y="182" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">D</text>
<rect x="544" y="140" width="32" height="66" rx="0" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="560.0" y="182" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">留</text>
<path d="M64 208 V224" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="255" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">0</text>
<path d="M320 208 V224" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="320" y="255" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">128</text>
<path d="M448 208 V224" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="448" y="255" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">192</text>
<path d="M512 208 V224" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="512" y="285" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">224</text>
<path d="M544 208 V224" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="544" y="255" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">240</text>
<path d="M576 208 V224" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="576" y="285" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">256</text>
<text x="320" y="329" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">每段长度 = 整块地址数</text>
<rect x="30" y="370" width="580" height="94" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="50" y="403" font-size="26" fill="#243247" text-anchor="start" font-weight="600">A  /25 · 128 个地址</text>
<text x="50" y="441" font-size="24" fill="#243247" text-anchor="start" font-weight="500">网络 .0   主机 .1～.126   广播 .127</text>
<rect x="30" y="482" width="580" height="94" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="50" y="515" font-size="26" fill="#243247" text-anchor="start" font-weight="600">B  /26 · 64 个地址</text>
<text x="50" y="553" font-size="24" fill="#243247" text-anchor="start" font-weight="500">网络 .128   主机 .129～.190   广播 .191</text>
<rect x="30" y="594" width="580" height="94" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="50" y="627" font-size="26" fill="#243247" text-anchor="start" font-weight="600">C  /27 · 32 个地址</text>
<text x="50" y="665" font-size="24" fill="#243247" text-anchor="start" font-weight="500">网络 .192   主机 .193～.222   广播 .223</text>
<rect x="30" y="706" width="580" height="94" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="50" y="739" font-size="26" fill="#243247" text-anchor="start" font-weight="600">D  /28 · 16 个地址</text>
<text x="50" y="777" font-size="24" fill="#243247" text-anchor="start" font-weight="500">网络 .224   主机 .225～.238   广播 .239</text>
<rect x="30" y="818" width="580" height="94" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="50" y="851" font-size="26" fill="#243247" text-anchor="start" font-weight="600">留作扩展  /28 · 16 个地址</text>
<text x="50" y="889" font-size="24" fill="#243247" text-anchor="start" font-weight="500">网络 .240   主机 .241～.254   广播 .255</text>
<text x="320" y="970" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">A、B、C、D 分别满足 100、50、20、10 个接口</text>
</g>
</svg>
