<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 525" role="img" aria-labelledby="title desc"><title id="title">/26 地址块：70 应归到哪一块？</title><desc id="desc">四个块分别覆盖末字节0到63、64到127、128到191、192到255，70位于第二块；网络地址64，广播127。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">/26 地址块：70 应归到哪一块？</text><text x="540" y="108" font-size="23" fill="#243247" text-anchor="middle" font-weight="500">192.168.10.70/26：最后一个字节按 64 个地址分块</text><rect x="60" y="180" width="240" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="180.0" y="243.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0～63</text><text x="180" y="327" font-size="20" fill="#64748b" text-anchor="middle" font-weight="500">.0 /26</text><rect x="300" y="180" width="240" height="110" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/><text x="420.0" y="243.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">64～127</text><text x="420" y="327" font-size="20" fill="#64748b" text-anchor="middle" font-weight="500">.64 /26</text><rect x="540" y="180" width="240" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="660.0" y="243.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">128～191</text><text x="660" y="327" font-size="20" fill="#64748b" text-anchor="middle" font-weight="500">.128 /26</text><rect x="780" y="180" width="240" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="900.0" y="243.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">192～255</text><text x="900" y="327" font-size="20" fill="#64748b" text-anchor="middle" font-weight="500">.192 /26</text><path d="M420 390 V290" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="420" y="425" font-size="23" fill="#0d9488" text-anchor="middle" font-weight="500">70 落在第二块</text><text x="540" y="480" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">网络 .64    ·    广播 .127    ·    可用 .65～.126</text></g></svg>
