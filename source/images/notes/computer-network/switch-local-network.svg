<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc"><title id="title">本地交换：电脑 A 直接把帧送给 B</title><desc id="desc">电脑A与B同属一个子网及VLAN，交换机连接两者和路由器；高亮A经过交换机到B的路径，网关支路不高亮。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">本地交换：电脑 A 直接把帧送给 B</text><rect x="70" y="155" width="190" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="165.0" y="208.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">电脑 A</text><rect x="445" y="155" width="190" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="540.0" y="208.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">二层交换机</text><rect x="820" y="155" width="190" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="915.0" y="208.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">电脑 B</text><rect x="445" y="365" width="190" height="85" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="540.0" y="415.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">路由器 R1</text><path d="M260 200 H445" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><path d="M635 200 H820" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><path d="M540 245 V365" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="350" y="181" font-size="19" fill="#0d9488" text-anchor="middle" font-weight="500">目的 MAC = B</text><text x="725" y="181" font-size="19" fill="#0d9488" text-anchor="middle" font-weight="500">转向 B 的接口</text><text x="540" y="300" font-size="20" fill="#64748b" text-anchor="middle" font-weight="500">通往其他网络</text><text x="540" y="515" font-size="22" fill="#243247" text-anchor="middle" font-weight="500">A 与 B 在同一子网、同一 VLAN：帧经交换机直接交付</text><text x="540" y="554" font-size="21" fill="#64748b" text-anchor="middle" font-weight="500">交换机按目的 MAC 转发；本次交付不用经过网关</text></g></svg>
