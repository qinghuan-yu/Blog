<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 615" role="img" aria-labelledby="title desc"><title id="title">封装：把上层内容装进本层数据单元</title><desc id="desc">应用数据位于TCP报文段内，TCP位于IP数据报内，IP位于以太网帧内；帧最终通过物理介质传输。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">封装：把上层内容装进本层数据单元</text><rect x="65" y="115" width="950" height="405" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="87" y="153" font-size="23" fill="#2563eb" text-anchor="start" font-weight="500">以太网帧：MAC 首部与校验尾部</text><rect x="105" y="190" width="870" height="270" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="127" y="228" font-size="23" fill="#64748b" text-anchor="start" font-weight="500">IP 数据报：源 IP、目的 IP</text><rect x="145" y="265" width="790" height="155" rx="9" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/><text x="167" y="303" font-size="23" fill="#0d9488" text-anchor="start" font-weight="500">TCP 报文段：端口、序号等</text><rect x="185" y="335" width="710" height="55" rx="9" fill="#ffffff" stroke="#243247" stroke-width="2"/><text x="207" y="373" font-size="23" fill="#243247" text-anchor="start" font-weight="500">上层数据</text><text x="540" y="576" font-size="23" fill="#64748b" text-anchor="middle" font-weight="500">由内向外逐层封装，整个帧最终编码成信号传输</text></g></svg>
