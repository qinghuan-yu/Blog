<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1180" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">二维积分：先画区域，再定上下限</title><desc id="desc">联合密度在0&lt;y&lt;x&lt;1内为2。竖切片从y=0到y=x，横切片从x=y到x=1。事件Y&lt;1/2与三角形交集面积为3/8，概率为3/4。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">二维积分：先画区域，再定上下限</text>
<text x="320" y="88" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">D：0 &lt; y &lt; x &lt; 1，区域内密度为 2</text>
<path d="M110 510 L470 510 L470 150 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M110 510 L485 510" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<path d="M110 510 L110 135" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="490" y="540" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">x</text>
<text x="85" y="120" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">y</text>
<text x="92" y="538" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<text x="470" y="540" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">1</text>
<text x="88" y="158" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">1</text>
<path d="M362 510 L362 258" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M236 384 L470 384" fill="none" stroke="#0d9488" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="320" y="564" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">竖切片：0 &lt; y &lt; x，fX(x) = 2x</text>
<text x="320" y="601" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">横切片：y &lt; x &lt; 1，fY(y) = 2(1−y)</text>
<path d="M110 1060 L470 1060 L470 700 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M110 1060 L485 1060" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<path d="M110 1060 L110 685" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="490" y="1090" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">x</text>
<text x="85" y="670" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">y</text>
<text x="92" y="1088" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<text x="470" y="1090" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">1</text>
<text x="88" y="708" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">1</text>
<path d="M110 1060 L470 1060 L470 880 L290 880 Z" fill="#bde5de" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M110 880 L470 880" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<text x="87" y="888" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">½</text>
<text x="320" y="976" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="600">Y &lt; ½</text>
<text x="320" y="1136" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="600">P(Y &lt; ½) = 2 × ⅜ = ¾</text>
</g>
</svg>
