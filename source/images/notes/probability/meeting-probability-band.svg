<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 770" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">会面问题：等待 15 分钟的斜带</title><desc id="desc">到达时刻x和y在0至60分钟内均匀独立。满足|x−y|≤15的区域是正方形中的斜带，两块未相遇三角形直角边长45，概率7/16。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">会面问题：等待 15 分钟的斜带</text>
<text x="320" y="90" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">到达时刻 x、y ∈ [0,60] 分钟</text>
<rect x="110" y="170" width="420" height="420" rx="0" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M110 590 L215 590 L530 275 L530 170 L425 170 L110 485 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M110 590 L530 170" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<path d="M110 590 L545 590" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<path d="M110 590 L110 155" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="550" y="620" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">x</text>
<text x="85" y="140" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">y</text>
<text x="92" y="618" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<text x="215" y="625" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">15</text>
<text x="75" y="493" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">15</text>
<text x="425" y="625" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">45</text>
<text x="75" y="283" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">45</text>
<text x="530" y="625" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">60</text>
<text x="75" y="178" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">60</text>
<text x="320" y="360" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="600">|x−y| ≤ 15</text>
<text x="320" y="672" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">相遇概率 = 1 − 45² / 60²</text>
<text x="320" y="717" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="600">= 7/16 = 43.75%</text>
</g>
</svg>
