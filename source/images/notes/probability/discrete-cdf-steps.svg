<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">离散分布：跳跃高度就是概率</title><desc id="desc">随机变量取1、2、3，概率分别0.2、0.5、0.3。CDF在1、2、3处右连续，分别跳到0.2、0.7、1，空心点表示上一段不含右端点。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">离散分布：跳跃高度就是概率</text>
<text x="320" y="88" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">P(X=1)=0.2，P(X=2)=0.5，P(X=3)=0.3</text>
<path d="M85 560 L610 560" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<path d="M85 560 L85 165" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="615" y="590" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">x</text>
<text x="60" y="150" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">F</text>
<text x="67" y="588" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<path d="M85 560 L210 560" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M210 490 L335 490" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M335 315 L460 315" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M460 210 L585 210" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="210" cy="560" r="6" fill="white" stroke="#0d9488" stroke-width="2"/>
<circle cx="210" cy="490" r="6" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
<path d="M210 560 L210 490" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<text x="210" y="595" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">1</text>
<text x="248" y="533" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">+0.2</text>
<circle cx="335" cy="490" r="6" fill="white" stroke="#0d9488" stroke-width="2"/>
<circle cx="335" cy="315" r="6" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
<path d="M335 490 L335 315" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<text x="335" y="595" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">2</text>
<text x="373" y="410.5" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">+0.5</text>
<circle cx="460" cy="315" r="6" fill="white" stroke="#0d9488" stroke-width="2"/>
<circle cx="460" cy="210" r="6" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
<path d="M460 315 L460 210" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<text x="460" y="595" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">3</text>
<text x="498" y="270.5" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">+0.3</text>
<text x="55" y="498" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0.2</text>
<text x="55" y="323" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0.7</text>
<text x="55" y="218" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">1</text>
<text x="320" y="658" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">实心点取当前值：F(2) = 0.7</text>
</g>
</svg>
