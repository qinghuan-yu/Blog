<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">条件概率：在 B 中重新计数</title><desc id="desc">十个等可能结果中，B包含五个，A与B的交集包含两个，所以P(A|B)=2/5；图中每个点代表一个等可能结果。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">条件概率：在 B 中重新计数</text>
<text x="320" y="90" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">每个点代表一个等可能结果</text>
<rect x="30" y="130" width="580" height="370" rx="10" fill="none" stroke="#64748b" stroke-width="2"/>
<text x="62" y="164" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">Ω</text>
<circle cx="245" cy="310" r="120" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<circle cx="395" cy="310" r="120" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="200" y="208" font-size="28" fill="#243247" text-anchor="middle" font-weight="500">A</text>
<text x="440" y="208" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="500">B</text>
<circle cx="200" cy="275" r="7" fill="#64748b" stroke="#64748b" stroke-width="2"/>
<circle cx="200" cy="350" r="7" fill="#64748b" stroke="#64748b" stroke-width="2"/>
<circle cx="90" cy="210" r="7" fill="#64748b" stroke="#64748b" stroke-width="2"/>
<circle cx="555" cy="180" r="7" fill="#64748b" stroke="#64748b" stroke-width="2"/>
<circle cx="90" cy="440" r="7" fill="#64748b" stroke="#64748b" stroke-width="2"/>
<circle cx="435" cy="260" r="7" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
<circle cx="450" cy="310" r="7" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
<circle cx="420" cy="355" r="7" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
<circle cx="320" cy="285" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<circle cx="320" cy="335" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="320" y="548" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">Ω 中 10 个，B 中 5 个，A∩B 中 2 个</text>
<text x="320" y="598" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="600">P(A | B) = (2/10) ÷ (5/10) = 2/5</text>
</g>
</svg>
