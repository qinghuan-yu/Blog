<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 905" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">MCMer：前端、编排与工作区</title>
<desc id="desc">Vue前端向FastAPI提交任务，FastAPI通过WebSocket回传进度。后端编排Agent，Agent通过LiteLLM调用模型，通过Jupyter Kernel执行代码，任务产物保存到独立work_dir。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">MCMer：前端、编排与工作区</text>
<rect x="170" y="95" width="300" height="76" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="125.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">Vue 3 前端</text>
<text x="320.0" y="157.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">提交 · 进度 · 下载</text>
<path d="M260 171 V255" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="180" y="218" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">任务请求</text>
<path d="M380 255 V171" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="480" y="210" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">WebSocket</text>
<text x="480" y="241" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">阶段进度</text>
<rect x="130" y="255" width="380" height="76" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="285.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">FastAPI 后端</text>
<text x="320.0" y="317.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">任务管理与 Agent 编排</text>
<path d="M320 331 V382" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="170" y="382" width="300" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="422.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">多阶段 Agent</text>
<path d="M220 446 V492 H150 V525" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<path d="M420 446 V492 H490 V525" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="35" y="525" width="240" height="85" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="155.0" y="559.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">LiteLLM</text>
<text x="155.0" y="591.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">模型调用</text>
<rect x="365" y="525" width="240" height="85" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="485.0" y="559.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">Jupyter Kernel</text>
<text x="485.0" y="591.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">代码执行</text>
<path d="M490 610 V665 H320 V710" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M150 610 V665 H320" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="70" y="710" width="500" height="120" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="746.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">work_dir/&lt;task_id&gt;/</text>
<text x="320.0" y="778.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">数据 · 证据 · 图表 · Notebook</text>
<text x="320.0" y="810.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">res.md / res.docx / res.json</text>
<text x="320" y="875" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">每个任务一份工作区，产物落盘后可回看</text>
</g>
</svg>
