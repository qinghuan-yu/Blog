<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1035" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">MCMer：结果与图表分别过闸</title>
<desc id="desc">数值注册表的verified_results进入写作，blocked_results保留阻断记录。图表检查路径、目录、语言和审查状态后进入paper_ready_images，未通过和调试产物留在调试隔离区。Writer输出在最终保存前再核对白名单。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">MCMer：结果与图表分别过闸</text>
<text x="30" y="95" font-size="26" fill="#243247" text-anchor="start" font-weight="600">① 数值结果</text>
<rect x="120" y="120" width="400" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="158.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">result_registry.json</text>
<path d="M235 180 V213 H165 V245" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M405 180 V213 H475 V245" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="30" y="245" width="270" height="80" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="165.0" y="277.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">verified_results</text>
<text x="165.0" y="309.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">供正文引用</text>
<rect x="340" y="245" width="270" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="475.0" y="277.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">blocked_results</text>
<text x="475.0" y="309.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">保留阻断记录</text>
<text x="30" y="390" font-size="26" fill="#243247" text-anchor="start" font-weight="600">② 图表产物</text>
<rect x="60" y="415" width="520" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="457.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">检查路径与目录</text>
<text x="320.0" y="489.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">匹配论文语言 · 检查审查状态</text>
<path d="M235 515 V550 H165 V585" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M405 515 V550 H475 V585" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="150" y="550" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">通过</text>
<text x="485" y="550" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">未通过 / 调试</text>
<rect x="30" y="585" width="270" height="84" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="165.0" y="619.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">paper_ready_images</text>
<text x="165.0" y="651.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">写作图片白名单</text>
<rect x="340" y="585" width="270" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="475.0" y="619.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">debug_artifacts</text>
<text x="475.0" y="651.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">隔离与回查</text>
<path d="M165 325 V355 H12 V735 H165 V765" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M165 669 V765" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="65" y="765" width="510" height="64" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320.0" y="805.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">WriterAgent：引用结果与白名单图</text>
<path d="M320 829 V870" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="100" y="870" width="440" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="908.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">终稿保存前，再核对图片白名单</text>
<path d="M320 930 V972" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="320" y="1005" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">res.md / res.docx</text>
</g>
</svg>
