<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1440" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">Dialograph 的证据与报告流程</title>
<desc id="desc">本地输入经过分块提取与原文绑定。唯一匹配的证据参与事件选材，覆盖不足时检索完整会话。模型输出关系与人物结论 JSON，本机校验、回填事实并编译双报告。默认交付待人工确认稿，网页支持原文回查。检索路径的两份报告独立生成，普通路径的人物侧写另参考关系报告。</desc>
<defs>
