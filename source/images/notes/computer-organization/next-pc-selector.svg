<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 565" role="img" aria-labelledby="title desc"><title id="title">下一 PC：顺序执行还是跳转？</title><desc id="desc">PC+4与JumpTarget进入MUX；跳转选择信号控制输出到PC的D端，PC在有效时钟沿更新。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">下一 PC：顺序执行还是跳转？</text><rect x="85" y="145" width="250" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="210.0" y="193.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PC + 4</text><rect x="85" y="325" width="250" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="210.0" y="373.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">JumpTarget</text><path d="M535 135 L665 160 V390 L535 415 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2.5"/><text x="600.0" y="282.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">MUX</text><rect x="845" y="225" width="160" height="105" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="925.0" y="285.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PC</text><path d="M335 185 H535" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M335 365 H535" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><path d="M665 275 H845" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="741" y="257" font-size="23" fill="#0d9488" text-anchor="middle" font-weight="500">D</text><text x="568" y="198" font-size="22" fill="#243247" text-anchor="middle" font-weight="500">0</text><text x="568" y="373" font-size="22" fill="#0d9488" text-anchor="middle" font-weight="500">1</text><text x="600" y="91" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">跳转选择信号</text><path d="M600 105 V147" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="540" y="486" font-size="22" fill="#243247" text-anchor="middle" font-weight="500">选择信号为 0：顺序地址；为 1：跳转目标</text><text x="540" y="528" font-size="21" fill="#64748b" text-anchor="middle" font-weight="500">MUX 准备下一地址，PC 在有效时钟沿保存它</text></g></svg>
