<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">单周期：相邻上升沿之间完成一条指令</title><desc id="desc">四个上升沿位于120、400、680、960，三个等宽指令周期与这些边沿对齐；每条指令在周期末提交。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">单周期：相邻上升沿之间完成一条指令</text><path d="M55 125 H120 V85 H180 V125 H400 V85 H460 V125 H680 V85 H740 V125 H960 V85 H1020 V125" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M120 145 V403" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><text x="120" y="75" font-size="18" fill="#64748b" text-anchor="middle" font-weight="500">沿 1</text><path d="M400 145 V403" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><text x="400" y="75" font-size="18" fill="#64748b" text-anchor="middle" font-weight="500">沿 2</text><path d="M680 145 V403" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><text x="680" y="75" font-size="18" fill="#64748b" text-anchor="middle" font-weight="500">沿 3</text><path d="M960 145 V403" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><text x="960" y="75" font-size="18" fill="#64748b" text-anchor="middle" font-weight="500">沿 4</text><rect x="120" y="185" width="280" height="195" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/><text x="260.0" y="290.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500"></text><text x="260" y="225" font-size="27" fill="#243247" text-anchor="middle" font-weight="600">指令 1</text><text x="260" y="270" font-size="23" fill="#243247" text-anchor="middle" font-weight="500">IF → ID → EX</text><text x="260" y="307" font-size="23" fill="#243247" text-anchor="middle" font-weight="500">→ MEM → WB</text><text x="260" y="350" font-size="20" fill="#0d9488" text-anchor="middle" font-weight="500">周期内完成计算</text><rect x="400" y="185" width="280" height="195" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="540.0" y="290.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500"></text><text x="540" y="225" font-size="27" fill="#243247" text-anchor="middle" font-weight="600">指令 2</text><text x="540" y="286" font-size="25" fill="#243247" text-anchor="middle" font-weight="500">完整执行</text><text x="540" y="330" font-size="20" fill="#64748b" text-anchor="middle" font-weight="500">末端边沿提交</text><rect x="680" y="185" width="280" height="195" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="820.0" y="290.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500"></text><text x="820" y="225" font-size="27" fill="#243247" text-anchor="middle" font-weight="600">指令 3</text><text x="820" y="286" font-size="25" fill="#243247" text-anchor="middle" font-weight="500">完整执行</text><text x="820" y="330" font-size="20" fill="#64748b" text-anchor="middle" font-weight="500">末端边沿提交</text><text x="540" y="438" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">指令 1 在沿 1 后开始传播，在沿 2 提交；指令 2 随后开始</text><text x="540" y="476" font-size="19" fill="#64748b" text-anchor="middle" font-weight="500">一个周期容纳整条指令；功能阶段没有被分配成五个独立周期</text></g></svg>
