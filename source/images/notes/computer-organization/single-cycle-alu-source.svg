<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">ALUSrc：决定 ALU 的第二个输入</title><desc id="desc">x1 进入 ALU 的 A 端；x2 与立即数经 ALUSrc 控制的 MUX 进入 B 端。LOAD 和 STORE 选择立即数。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">ALUSrc：决定 ALU 的第二个输入</text><path d="M760 120 L940 150 V300 L760 330 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2.5"/><text x="850.0" y="222.0" font-size="30" fill="#243247" text-anchor="middle" font-weight="600">ALU</text><text x="850.0" y="255.0" font-size="22" fill="#0d9488" text-anchor="middle" font-weight="500">加法</text><path d="M400 185 L520 210 V310 L400 335 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2.5"/><text x="460.0" y="267.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">MUX</text><text x="90" y="127" font-size="25" fill="#243247" text-anchor="middle" font-weight="500">x1</text><text x="90" y="227" font-size="25" fill="#243247" text-anchor="middle" font-weight="500">x2</text><text x="110" y="317" font-size="25" fill="#243247" text-anchor="middle" font-weight="500">立即数 8</text><path d="M145 120 H690 V165 H760" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M145 220 H400" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M205 310 H400" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><path d="M520 260 H650 V285 H760" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="610" y="246" font-size="19" fill="#0d9488" text-anchor="middle" font-weight="500">B 输入</text><path d="M460 130 V198" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="460" y="112" font-size="22" fill="#0d9488" text-anchor="middle" font-weight="500">ALUSrc</text><text x="430" y="226" font-size="18" fill="#64748b" text-anchor="middle" font-weight="500">0</text><text x="430" y="309" font-size="18" fill="#0d9488" text-anchor="middle" font-weight="500">1</text><text x="540" y="389" font-size="21" fill="#64748b" text-anchor="middle" font-weight="500">ALUSrc = 0：选寄存器数据；ALUSrc = 1：选立即数</text></g></svg>
