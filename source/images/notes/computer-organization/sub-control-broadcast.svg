<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 835" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">SUB：翻转 B 的每一位，只在 C₀ 加 1</title>
<desc id="desc">四位加减器的SUB同时控制B3到B0的异或门，并接入最低位C0。例A0101、B0011、SUB1产生B′1100，计算0101+1100+1得到低四位0010。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">SUB：翻转 B 的每一位，只在 C₀ 加 1</text>
<text x="320" y="84" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">A = 0101，B = 0011，SUB = 1</text>
<path d="M45 140 H600 V520 H578 V452" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="58" y="125" font-size="24" fill="#2563eb" text-anchor="start" font-weight="500">SUB</text>
<text x="105" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">B3 = 0</text>
<path d="M105 202 V242" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<circle cx="105" cy="265" r="23" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="105" y="274" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="500">⊕</text>
<path d="M63 140 V265 H82" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<circle cx="63" cy="140" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<path d="M105 288 V324 H130 V410" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="130" y="364" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="500">1</text>
<text x="75" y="375" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<path d="M75 382 V410" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="53" y="410" width="104" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="105" y="459" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">FA3</text>
<path d="M105 494 V575" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="105" y="613" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="600">0</text>
<path d="M193 452 H157" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="245" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">B2 = 0</text>
<path d="M245 202 V242" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<circle cx="245" cy="265" r="23" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="245" y="274" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="500">⊕</text>
<path d="M203 140 V265 H222" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<circle cx="203" cy="140" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<path d="M245 288 V324 H270 V410" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="270" y="364" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="500">1</text>
<text x="215" y="375" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">1</text>
<path d="M215 382 V410" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="193" y="410" width="104" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="245" y="459" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">FA2</text>
<path d="M245 494 V575" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="245" y="613" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="600">0</text>
<path d="M333 452 H297" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="385" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">B1 = 1</text>
<path d="M385 202 V242" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<circle cx="385" cy="265" r="23" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="385" y="274" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="500">⊕</text>
<path d="M343 140 V265 H362" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<circle cx="343" cy="140" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<path d="M385 288 V324 H410 V410" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="410" y="364" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="500">0</text>
<text x="355" y="375" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<path d="M355 382 V410" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="333" y="410" width="104" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="385" y="459" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">FA1</text>
<path d="M385 494 V575" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="385" y="613" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="600">1</text>
<path d="M473 452 H437" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="525" y="190" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">B0 = 1</text>
<path d="M525 202 V242" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<circle cx="525" cy="265" r="23" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="525" y="274" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="500">⊕</text>
<path d="M483 140 V265 H502" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<circle cx="483" cy="140" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<path d="M525 288 V324 H550 V410" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="550" y="364" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="500">0</text>
<text x="495" y="375" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">1</text>
<path d="M495 382 V410" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="473" y="410" width="104" height="84" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="525" y="459" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">FA0</text>
<path d="M525 494 V575" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="525" y="613" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="600">0</text>
<text x="543" y="552" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">C₀ = 1</text>
<path d="M53 452 H20 V552" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="66" y="587" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">C₄=1</text>
<text x="320" y="669" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">B′ = 1100   ·   A + B′ + C₀ = 1 0010</text>
<text x="320" y="716" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="600">低 4 位结果：0010 = 2</text>
<text x="320" y="770" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">SUB 广播到每个 XOR</text>
<text x="320" y="811" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">其余进位由相邻全加器逐级传递</text>
</g>
</svg>
