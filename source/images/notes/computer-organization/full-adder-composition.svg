<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 535" role="img" aria-labelledby="title desc"><title id="title">两个半加器怎样组成全加器</title><desc id="desc">第一个半加器处理A与B，临时和T进入第二个半加器与Cin相加得到S；两个进位P与Q经OR得到Cout。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">两个半加器怎样组成全加器</text><rect x="250" y="135" width="230" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="365.0" y="198.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">半加器 1</text><rect x="615" y="135" width="230" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="730.0" y="198.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">半加器 2</text><rect x="650" y="330" width="185" height="75" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="742.5" y="375.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">OR</text><text x="95" y="169" font-size="25" fill="#243247" text-anchor="middle" font-weight="500">A</text><text x="95" y="220" font-size="25" fill="#243247" text-anchor="middle" font-weight="500">B</text><path d="M125 162 H250" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M125 213 H250" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M480 180 H615" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="545" y="164" font-size="22" fill="#0d9488" text-anchor="middle" font-weight="500">T</text><text x="730" y="91" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">Cin</text><path d="M730 104 V135" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M845 180 H990" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="953" y="162" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">S</text><path d="M365 245 V367 H650" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="388" y="286" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="500">P</text><path d="M730 245 V330" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="755" y="291" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="500">Q</text><path d="M835 367 H990" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="950" y="349" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="500">Cout</text><text x="540" y="459" font-size="23" fill="#243247" text-anchor="middle" font-weight="500">T = A XOR B；S = T XOR Cin；Cout = P OR Q</text><text x="540" y="497" font-size="20" fill="#64748b" text-anchor="middle" font-weight="500">P、Q 分别是两个半加器的进位输出</text></g></svg>
