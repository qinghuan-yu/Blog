<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 595" role="img" aria-labelledby="title desc"><title id="title">寄存器：多位数据，共用时钟</title><desc id="desc">各位D分别进入触发器，各位Q分别输出；左侧蓝色时钟干线向每个触发器提供时钟，不连接数据通路。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">寄存器：多位数据，共用时钟</text><text x="125" y="133" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">D31</text><rect x="330" y="95" width="240" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="450.0" y="135.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">D 触发器</text><path d="M175 125 H330" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M570 125 H920" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="966" y="133" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">Q31</text><text x="125" y="218" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">D30</text><rect x="330" y="180" width="240" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="450.0" y="220.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">D 触发器</text><path d="M175 210 H330" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M570 210 H920" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="966" y="218" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">Q30</text><text x="125" y="348" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">D1</text><rect x="330" y="310" width="240" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="450.0" y="350.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">D 触发器</text><path d="M175 340 H330" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M570 340 H920" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="966" y="348" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">Q1</text><text x="125" y="433" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">D0</text><rect x="330" y="395" width="240" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="450.0" y="435.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">D 触发器</text><path d="M175 425 H330" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M570 425 H920" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="966" y="433" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">Q0</text><text x="125" y="286" font-size="34" fill="#243247" text-anchor="middle" font-weight="500">⋮</text><text x="450" y="286" font-size="34" fill="#243247" text-anchor="middle" font-weight="500">⋮</text><text x="966" y="286" font-size="34" fill="#243247" text-anchor="middle" font-weight="500">⋮</text><path d="M40 177 H450 V159" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><circle cx="40" cy="177" r="4" fill="#2563eb"/><path d="M40 262 H450 V244" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><circle cx="40" cy="262" r="4" fill="#2563eb"/><path d="M40 392 H450 V374" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><circle cx="40" cy="392" r="4" fill="#2563eb"/><path d="M40 477 H450 V459" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><circle cx="40" cy="477" r="4" fill="#2563eb"/><path d="M40 520 V177" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="145" y="559" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="500">共同的时钟</text><text x="750" y="525" font-size="21" fill="#64748b" text-anchor="middle" font-weight="500">32 个存储位并排组成 32 位寄存器</text></g></svg>
