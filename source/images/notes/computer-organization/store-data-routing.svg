<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc"><title id="title">STORE：地址和待存数据走两条路</title><desc id="desc">x1与立即数经ALU相加计算1008作为地址，x2的42通过独立线路送往数据存储器写数据端。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">STORE：地址和待存数据走两条路</text><rect x="65" y="135" width="220" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="175.0" y="183.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">x1 = 1000</text><rect x="65" y="330" width="220" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="175.0" y="378.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">x2 = 42</text><rect x="380" y="260" width="190" height="75" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="475.0" y="305.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">立即数 8</text><rect x="655" y="135" width="180" height="120" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="745.0" y="203.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">ALU：加法</text><rect x="650" y="370" width="330" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="815.0" y="433.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">数据存储器</text><path d="M285 175 H655" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M570 297 H610 V225 H655" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><path d="M745 255 V370" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="831" y="318" font-size="23" fill="#0d9488" text-anchor="middle" font-weight="500">地址 1008</text><path d="M285 370 H495 V425 H650" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="431" y="407" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="500">写入数据 42</text><text x="540" y="548" font-size="22" fill="#243247" text-anchor="middle" font-weight="500">MemWrite = 1：写内存；RegWrite = 0：不写通用寄存器</text></g></svg>
