<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc"><title id="title">BEQ：比较结果决定下一条指令</title><desc id="desc">ALU 用减法比较 x1、x2；Branch 与 Zero 相与控制 PC 的 MUX，选择 PC+4 或 PC+ImmB。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">BEQ：比较结果决定下一条指令</text><rect x="55" y="130" width="250" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="180.0" y="188.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">ALU：x1 − x2</text><rect x="425" y="130" width="170" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="510.0" y="188.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">AND</text><path d="M765 285 L880 310 V410 L765 435 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2.5"/><text x="822.5" y="367.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">MUX</text><rect x="940" y="320" width="100" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="990.0" y="364.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PC</text><path d="M305 180 H425" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="360" y="163" font-size="21" fill="#0d9488" text-anchor="middle" font-weight="500">Zero</text><path d="M510 90 V130" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="510" y="74" font-size="22" fill="#0d9488" text-anchor="middle" font-weight="500">Branch</text><path d="M595 180 H820 V297" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="741" y="163" font-size="22" fill="#0d9488" text-anchor="middle" font-weight="500">PCSrc</text><rect x="105" y="290" width="280" height="65" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="245.0" y="330.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PC + 4</text><rect x="105" y="395" width="280" height="65" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="245.0" y="435.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PC + ImmB</text><path d="M385 322 H765" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M385 427 H710 V405 H765" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="792" y="327" font-size="18" fill="#243247" text-anchor="middle" font-weight="500">0</text><text x="792" y="403" font-size="18" fill="#0d9488" text-anchor="middle" font-weight="500">1</text><path d="M880 360 H940" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="540" y="518" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">PCSrc = Branch AND Zero：相等且为 BEQ 时选择分支目标</text><text x="540" y="555" font-size="18" fill="#64748b" text-anchor="middle" font-weight="500">ImmB 为相对当前 PC 的有符号字节偏移；目标地址由独立加法器计算</text></g></svg>
