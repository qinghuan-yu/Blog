<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">MemtoReg：决定写回哪个结果</title><desc id="desc">ALU 结果和数据存储器读数经过 MUX 进入寄存器堆写数据端。MemtoReg 为0选 ALU，为1选内存。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">MemtoReg：决定写回哪个结果</text><path d="M465 130 L585 155 V275 L465 300 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2.5"/><text x="525.0" y="222.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">MUX</text><rect x="800" y="170" width="215" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="907.5" y="228.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">寄存器堆</text><text x="210" y="179" font-size="25" fill="#243247" text-anchor="middle" font-weight="500">ALU 结果</text><text x="210" y="278" font-size="25" fill="#243247" text-anchor="middle" font-weight="500">内存读出数据</text><path d="M330 171 H465" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M330 270 H465" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><path d="M585 215 H800" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="691" y="195" 