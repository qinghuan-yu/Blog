<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-labelledby="title desc"><title id="title">单周期 CPU 的主通路骨架</title><desc id="desc">PC 从指令存储器取指；寄存器数据进入 ALU，ALU 结果或内存数据经 MUX 写回；PC+4 单独更新 PC。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">单周期 CPU 的主通路骨架</text><rect x="50" y="110" width="120" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="110.0" y="154.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PC</text><rect x="240" y="110" width="200" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="340.0" y="154.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">指令存储器</text><rect x="500" y="110" width="190" height="130" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="595.0" y="183.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">寄存器堆</text><path d="M820 110 L950 140 V220 L820 250 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2.5"/><text x="885.0" y="177.0" font-size="30" fill="#243247" text-anchor="middle" font-weight="600">ALU</text><text x="885.0" y="210.0" font-size="22" fill="#0d9488" text-anchor="middle" font-weight="500">运算</text><rect x="780" y="350" width="220" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="890.0" y="403.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">数据存储器</text><rect x="460" y="350" width="200" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="560.0" y="403.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">写回 MUX</text><rect x="50" y="350" width="170" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="135.0" y="394.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">PC + 4</text><path d="M170 146 H240" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M440 146 H500" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="469" y="129" font-size="17" fill="#243247" text-anchor="middle" font-weight="500">字段</text><path d="M690 150 H820" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M690 205 H760 V210 H820" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M950 180 H1025 V310 H890 V350" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="954" y="331" font-size="18" fill="#243247" text-anchor="middle" font-weight="500">地址</text><path d="M1025 270 H560 V350" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><circle cx="1025" cy="270" r="4" fill="#64748b"/><text x="655" y="292" font-size="18" fill="#243247" text-anchor="middle" font-weight="500">ALU 结果</text><path d="M780 395 H660" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="724" y="381" font-size="18" fill="#243247" text-anchor="middle" font-weight="500">读出数据</text><path d="M460 395 H400 V285 H550 V240" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#teal)"/><text x="458" y="274" font-size="18" fill="#0d9488" text-anchor="middle" font-weight="500">写回</text><path d="M720 205 V480 H930 V440" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><circle cx="720" cy="205" r="4" fill="#64748b"/><text x="833" y="505" font-size="18" fill="#243247" text-anchor="middle" font-weight="500">STORE 写入数据</text><path d="M110 182 V350" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M50 386 H20 V146 H50" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#gray)"/><text x="130" y="450" font-size="18" fill="#243247" text-anchor="middle" font-weight="500">顺序执行的 PC 更新</text><text x="540" y="563" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">主通路骨架：先画出 ADD、LOAD、STORE 共用的部件</text><text x="540" y="599" font-size="18" fill="#64748b" text-anchor="middle" font-weight="500">立即数选择和分支地址通路在后续图中补入；虚线表示写回</text></g></svg>
