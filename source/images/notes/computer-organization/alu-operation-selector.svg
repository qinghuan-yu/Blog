<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc"><title id="title">ALU：运算模块与结果选择</title><desc id="desc">A和B连接到加减法、AND、OR、XOR模块；各模块输出进入MUX，由结果选择信号选出最终结果。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">ALU：运算模块与结果选择</text><text x="95" y="270" font-size="27" fill="#243247" text-anchor="middle" font-weight="500">A、B</text><path d="M150 263 H215 V120" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M215 263 V410" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="310" y="91" width="220" height="68" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="420.0" y="133.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">加减法模块</text><path d="M215 125 H310" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><circle cx="215" cy="125" r="4" fill="#64748b"/><path d="M530 125 H700 V125" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="310" y="181" width="220" height="68" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="420.0" y="223.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">AND</text><path d="M215 215 H310" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><circle cx="215" cy="215" r="4" fill="#64748b"/><path d="M530 215 H700 V215" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="310" y="271" width="220" height="68" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="420.0" y="313.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">OR</text><path d="M215 305 H310" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><circle cx="215" cy="305" r="4" fill="#64748b"/><path d="M530 305 H700 V305" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="310" y="361" width="220" height="68" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="420.0" y="403.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">XOR</text><path d="M215 395 H310" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><circle cx="215" cy="395" r="4" fill="#64748b"/><path d="M530 395 H700 V395" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="700" y="85" width="150" height="355" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/><text x="775" y="267" font-size="29" fill="#243247" text-anchor="middle" font-weight="500">MUX</text><path d="M850 263 H1000" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="944" y="245" font-size="22" fill="#0d9488" text-anchor="middle" font-weight="500">Result</text><text x="775" y="497" font-size="23" fill="#0d9488" text-anchor="middle" font-weight="500">结果选择信号</text><path d="M775 472 V440" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><text x="540" y="555" font-size="21" fill="#64748b" text-anchor="middle" font-weight="500">输入送往各运算模块；MUX 选择本次输出</text></g></svg>
