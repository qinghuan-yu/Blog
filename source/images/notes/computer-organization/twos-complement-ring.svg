<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 840" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">4 位补码：同一位置，两种数值解释</title>
<desc id="desc">模16环外圈0至15为无符号解释，内圈0至7及负8至负1为补码解释。位置11的比特1011，解释成补码为负5。模16中后退5与前进11抵达同一位置。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">4 位补码：同一位置，两种数值解释</text>
<text x="320" y="84" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">外圈：无符号值   内圈：补码值</text>
<circle cx="320" cy="365" r="195" fill="none" stroke="#64748b" stroke-width="2"/>
<circle cx="320.0" cy="170.0" r="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="150.0" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">0</text>
<text x="320.0" y="215.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0</text>
<circle cx="394.6" cy="184.8" r="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="405.7" y="167.1" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">1</text>
<text x="380.5" y="227.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">1</text>
<circle cx="457.9" cy="227.1" r="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="478.4" y="215.6" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">2</text>
<text x="431.7" y="261.3" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">2</text>
