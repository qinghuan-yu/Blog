<text x="526.9" y="288.3" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">3</text>
<text x="466.0" y="312.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">3</text>
<circle cx="515.0" cy="365.0" r="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="544.0" y="374.0" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">4</text>
<text x="478.0" y="373.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">4</text>
<circle cx="500.2" cy="439.6" r="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="526.9" y="459.7" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">5</text>
