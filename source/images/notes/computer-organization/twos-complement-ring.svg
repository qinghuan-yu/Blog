<text x="234.3" y="580.9" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">9</text>
<text x="259.5" y="519.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">-7</text>
<circle cx="182.1" cy="502.9" r="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="161.6" y="532.4" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">10</text>
<text x="208.3" y="484.7" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">-6</text>
<circle cx="139.8" cy="439.6" r="5" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
