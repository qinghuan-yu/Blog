<text x="174.0" y="433.5" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">-5</text>
<circle cx="125.0" cy="365.0" r="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="96.0" y="374.0" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">12</text>
<text x="162.0" y="373.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">-4</text>
<circle cx="139.8" cy="290.4" r="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="113.1" y="288.3" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">13</text>
<text x="174.0" y="312.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">-3</text>
<circle cx="182.1" cy="227.1" r="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="161.6" y="215.6" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">14</text>
<text x="208.3" y="261.3" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">-2</text>
<circle cx="245.4" cy="184.8" r="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="234.3" y="167.1" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">15</text>
<text x="259.5" y="227.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">-1</text>
<text x="320" y="351" font-size="30" fill="#0d9488" text-anchor="middle" font-weight="600">1011</text>
<text x="320" y="392" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">无符号 11</text>
<text x="320" y="432" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">补码 −5</text>
<path d="M320 184 A181 181 0 1 1 152.78 434.27" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M320 155 A210 210 0 0 0 125.99 445.36" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="320" y="645" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">向前 11 格，与向后 5 格同终点</text>
<text x="320" y="690" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">−5 ≡ 11  (mod 16)</text>
<text x="320" y="740" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">编码 1000～1111 对应 −8～−1</text>
<text x="320" y="793" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">换的是解释规则，比特仍然相同</text>
</g>
</svg>
