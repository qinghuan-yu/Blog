<text x="478.4" y="532.4" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">6</text>
<text x="431.7" y="484.7" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">6</text>
<circle cx="394.6" cy="545.2" r="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="405.7" y="580.9" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">7</text>
<text x="380.5" y="519.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">7</text>
