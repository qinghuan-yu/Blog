<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc"><title id="title">ADD：两路读数，一路写回</title><desc id="desc">读取 x1=5 和 x2=7，ALU 相加得到12，再经写回通路在时钟沿写入 x3。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">ADD：两路读数，一路写回</text><rect x="90" y="100" width="300" height="225" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="240.0" y="220.5" font-size="24" fill="#243247" text-anchor="middle" font-weight="500"></text><text x="240" y="138" font-size="27" fill="#243247" text-anchor="middle" font-weight="600">寄存器堆</text><text x="240" y="187" font-size="22" fill="#243247" text-anchor="middle" font-weight="500">x1 = 5</text><text x="240" y="234" font-size="22" fill="#243247" text-anchor="middle" font-weight="500">x2 = 7</text><text x="240" y="286" font-size="23" fill="#0d9488" text-anchor="middle" font-weight="500">x3 ← 12</text><path d="M680 105 L850 135 V295 L680 325 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2.5"/><text x="765.0" y="212.0" font-size="30" fill="#243247" text-anchor="middle" font-weight="600">ALU</text><text x="765.0" y="245.0" font-size="22" fill="#0d9488" text-anchor="middle" font-weight="500">ADD</text><path d="M390 185 H520 V160 H680" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><path d="M390 232 H555 V270 H680" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><path d="M850 215 H975" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="914" y="197" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">12</text><path d="M975 215 V365 H240 V325" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#gray)"/><text x="580" y="403" font-size="22" fill="#64748b" text-anchor="middle" font-weight="500">结果先到写入端，再在有效时钟沿写入 x3</text></g></svg>
