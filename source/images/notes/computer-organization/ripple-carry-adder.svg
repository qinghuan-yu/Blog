<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 505" role="img" aria-labelledby="title desc"><title id="title">四位串行进位加法器</title><desc id="desc">四个全加器的蓝色进位线从最低位FA0连接到最高位FA3，输入0101与0111得到1100。</desc><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker></defs><g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif"><text x="540.0" y="45" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">四位串行进位加法器</text><rect x="115" y="180" width="135" height="100" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="182.5" y="238.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">FA0</text><text x="142" y="111" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">A0 = 1</text><text x="223" y="144" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">B0 = 1</text><path d="M142 123 V180" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M223 155 V180" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M182 280 V338" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="182" y="374" font-size="23" fill="#243247" text-anchor="middle" font-weight="500">S0 = 0</text><path d="M250 230 H355" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="302.5" y="213" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="500">C1 = 1</text><rect x="355" y="180" width="135" height="100" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="422.5" y="238.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">FA1</text><text x="382" y="111" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">A1 = 0</text><text x="463" y="144" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">B1 = 1</text><path d="M382 123 V180" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M463 155 V180" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M422 280 V338" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="422" y="374" font-size="23" fill="#243247" text-anchor="middle" font-weight="500">S1 = 0</text><path d="M490 230 H595" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="542.5" y="213" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="500">C2 = 1</text><rect x="595" y="180" width="135" height="100" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="662.5" y="238.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">FA2</text><text x="622" y="111" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">A2 = 1</text><text x="703" y="144" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">B2 = 1</text><path d="M622 123 V180" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M703 155 V180" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M662 280 V338" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="662" y="374" font-size="23" fill="#243247" text-anchor="middle" font-weight="500">S2 = 1</text><path d="M730 230 H835" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="782.5" y="213" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="500">C3 = 1</text><rect x="835" y="180" width="135" height="100" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="902.5" y="238.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">FA3</text><text x="862" y="111" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">A3 = 0</text><text x="943" y="144" font-size="21" fill="#243247" text-anchor="middle" font-weight="500">B3 = 0</text><path d="M862 123 V180" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M943 155 V180" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><path d="M902 280 V338" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="902" y="374" font-size="23" fill="#243247" text-anchor="middle" font-weight="500">S3 = 1</text><path d="M970 230 H1040" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="1005.0" y="213" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="500">C4 = 0</text><path d="M30 230 H115" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="65" y="211" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="500">C0 = 0</text><text x="540" y="425" font-size="21" fill="#64748b" text-anchor="middle" font-weight="500">由左到右：低位 → 高位；读数按 S3 S2 S1 S0 排列</text><text x="540" y="468" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">0101 + 0111 = 1100（无符号解释：5 + 7 = 12）</text></g></svg>
