<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 940" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">泰勒展开：在 x=0 附近逐阶贴合</title><desc id="desc">以指数函数e^x为例，一二三阶泰勒多项式分别1+x、1+x+x²/2、1+x+x²/2+x³/6，在0点逐阶匹配导数。x=1处三阶余项为e−8/3，约0.0516。</desc>
<defs>
