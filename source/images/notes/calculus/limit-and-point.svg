<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 880" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">极限与点值、左右极限</title>
<desc id="desc">上图的函数在 x≠1 时等于 x+1，在 x=1 时取值 3。蓝色空心点为 (1,2)，棕色实心点为 (1,3)，极限仍为 2。下图为 |x|/x，左侧为 −1，右侧为 1，所以在 0 处没有双侧极限。</desc>
<defs>
<mask id="open-point-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="880">
<rect width="640" height="880" fill="#fff"/>
<circle cx="270" cy="215" r="5.5" fill="#000"/>
<circle cx="320" cy="745" r="5.5" fill="#000"/>
<circle cx="320" cy="585" r="5.5" fill="#000"/>
</mask>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif" mask="url(#open-point-mask)">
<text x="40" y="42" font-size="28" fill="#243247" text-anchor="start" font-weight="600">1. 附近的极限与点值</text>
<line x1="75" y1="345" x2="565" y2="345" stroke="#64748b" stroke-width="2"/>
<line x1="120" y1="355" x2="120" y2="75" stroke="#64748b" stroke-width="2"/>
<text x="578" y="353" font-size="24" fill="#243247" text-anchor="start" font-weight="400">x</text>
<text x="105" y="65" font-size="24" fill="#243247" text-anchor="start" font-weight="400">y</text>
<text x="102" y="374" font-size="24" fill="#64748b" text-anchor="start" font-weight="400">0</text>
<line x1="270" y1="345" x2="270" y2="150" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="120" y1="215" x2="270" y2="215" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="120" y1="150" x2="270" y2="150" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="75" y1="299.5" x2="540" y2="98" stroke="#2563eb" stroke-width="3.5"/>
<circle cx="270" cy="215" r="7" fill="none" stroke="#2563eb" stroke-width="3"/>
<circle cx="270" cy="150" r="7" fill="#b45309" stroke="#b45309" stroke-width="3"/>
<text x="270" y="377" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">1</text>
<text x="105" y="224" font-size="24" fill="#64748b" text-anchor="end" font-weight="400">2</text>
<text x="105" y="159" font-size="24" fill="#64748b" text-anchor="end" font-weight="400">3</text>
<text x="350" y="125" font-size="24" fill="#b45309" text-anchor="start" font-weight="400">f(1) = 3</text>
<text x="350" y="252" font-size="24" fill="#2563eb" text-anchor="start" font-weight="400">x → 1 时，f(x) → 2</text>
<text x="320" y="419" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">将点值改为 2，函数就在此处连续</text>
<line x1="40" y1="447" x2="600" y2="447" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="490" font-size="28" fill="#243247" text-anchor="start" font-weight="600">2. 左右极限不同：|x| / x</text>
<line x1="75" y1="665" x2="565" y2="665" stroke="#64748b" stroke-width="2"/>
<line x1="320" y1="790" x2="320" y2="520" stroke="#64748b" stroke-width="2"/>
<text x="578" y="673" font-size="24" fill="#243247" text-anchor="start" font-weight="400">x</text>
<text x="335" y="535" font-size="24" fill="#243247" text-anchor="start" font-weight="400">y</text>
<text x="297" y="696" font-size="24" fill="#64748b" text-anchor="start" font-weight="400">0</text>
<line x1="80" y1="745" x2="320" y2="745" stroke="#b45309" stroke-width="4"/>
<line x1="320" y1="585" x2="555" y2="585" stroke="#2563eb" stroke-width="4"/>
<circle cx="320" cy="745" r="7" fill="none" stroke="#b45309" stroke-width="3"/>
<circle cx="320" cy="585" r="7" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="305" y="574" font-size="24" fill="#64748b" text-anchor="end" font-weight="400">1</text>
<text x="334" y="777" font-size="24" fill="#64748b" text-anchor="start" font-weight="400">−1</text>
<text x="95" y="714" font-size="24" fill="#b45309" text-anchor="start" font-weight="400">左极限 −1</text>
<text x="390" y="552" font-size="24" fill="#2563eb" text-anchor="start" font-weight="400">右极限 1</text>
<text x="320" y="842" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">两侧结果不同，双侧极限不存在</text>
</g>
</svg>
