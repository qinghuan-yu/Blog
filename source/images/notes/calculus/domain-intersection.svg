<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">定义域条件的交集</title>
<desc id="desc">函数为 ln(4−x²) 除以根号下 x²−1。对数要求 −2&lt;x&lt;2；分母根号要求 x&lt;−1 或 x&gt;1。交集为 (−2,−1) 与 (1,2)，四个端点均不包含。</desc>
<defs>
<mask id="open-point-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="590">
<rect width="640" height="590" fill="#fff"/>
<circle cx="160" cy="145" r="5.5" fill="#000"/>
<circle cx="480" cy="145" r="5.5" fill="#000"/>
<circle cx="240" cy="285" r="5.5" fill="#000"/>
<circle cx="400" cy="285" r="5.5" fill="#000"/>
<circle cx="160" cy="425" r="5.5" fill="#000"/>
<circle cx="240" cy="425" r="5.5" fill="#000"/>
<circle cx="400" cy="425" r="5.5" fill="#000"/>
<circle cx="480" cy="425" r="5.5" fill="#000"/>
</mask>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif" mask="url(#open-point-mask)">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">定义域：把条件放在同一条数轴上</text>
<text x="40" y="102" font-size="24" fill="#2563eb" text-anchor="start" font-weight="400">1. 对数真数为正：−2 &lt; x &lt; 2</text>
<line x1="60" y1="145" x2="580" y2="145" stroke="#64748b" stroke-width="2"/>
<path d="M572 140L580 145L572 150" fill="none" stroke="#64748b" stroke-width="2"/>
<line x1="160" y1="140" x2="160" y2="150" stroke="#64748b" stroke-width="2"/>
<text x="160" y="181" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">−2</text>
<line x1="240" y1="140" x2="240" y2="150" stroke="#64748b" stroke-width="2"/>
<text x="240" y="181" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">−1</text>
<line x1="320" y1="140" x2="320" y2="150" stroke="#64748b" stroke-width="2"/>
<text x="320" y="181" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">0</text>
<line x1="400" y1="140" x2="400" y2="150" stroke="#64748b" stroke-width="2"/>
<text x="400" y="181" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">1</text>
<line x1="480" y1="140" x2="480" y2="150" stroke="#64748b" stroke-width="2"/>
<text x="480" y="181" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">2</text>
<line x1="160" y1="145" x2="480" y2="145" stroke="#2563eb" stroke-width="6"/>
<circle cx="160" cy="145" r="7" fill="none" stroke="#2563eb" stroke-width="3"/>
<circle cx="480" cy="145" r="7" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="40" y="242" font-size="24" fill="#b45309" text-anchor="start" font-weight="400">2. 分母根号为正：x &lt; −1 或 x &gt; 1</text>
<line x1="60" y1="285" x2="580" y2="285" stroke="#64748b" stroke-width="2"/>
<path d="M572 280L580 285L572 290" fill="none" stroke="#64748b" stroke-width="2"/>
<line x1="160" y1="280" x2="160" y2="290" stroke="#64748b" stroke-width="2"/>
<text x="160" y="321" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">−2</text>
<line x1="240" y1="280" x2="240" y2="290" stroke="#64748b" stroke-width="2"/>
<text x="240" y="321" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">−1</text>
<line x1="320" y1="280" x2="320" y2="290" stroke="#64748b" stroke-width="2"/>
<text x="320" y="321" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">0</text>
<line x1="400" y1="280" x2="400" y2="290" stroke="#64748b" stroke-width="2"/>
<text x="400" y="321" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">1</text>
<line x1="480" y1="280" x2="480" y2="290" stroke="#64748b" stroke-width="2"/>
<text x="480" y="321" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">2</text>
<line x1="60" y1="285" x2="240" y2="285" stroke="#b45309" stroke-width="6"/>
<line x1="400" y1="285" x2="580" y2="285" stroke="#b45309" stroke-width="6"/>
<circle cx="240" cy="285" r="7" fill="none" stroke="#b45309" stroke-width="3"/>
<circle cx="400" cy="285" r="7" fill="none" stroke="#b45309" stroke-width="3"/>
<text x="40" y="382" font-size="24" fill="#0f766e" text-anchor="start" font-weight="400">3. 两项条件同时成立</text>
<line x1="60" y1="425" x2="580" y2="425" stroke="#64748b" stroke-width="2"/>
<path d="M572 420L580 425L572 430" fill="none" stroke="#64748b" stroke-width="2"/>
<line x1="160" y1="420" x2="160" y2="430" stroke="#64748b" stroke-width="2"/>
<text x="160" y="461" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">−2</text>
<line x1="240" y1="420" x2="240" y2="430" stroke="#64748b" stroke-width="2"/>
<text x="240" y="461" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">−1</text>
<line x1="320" y1="420" x2="320" y2="430" stroke="#64748b" stroke-width="2"/>
<text x="320" y="461" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">0</text>
<line x1="400" y1="420" x2="400" y2="430" stroke="#64748b" stroke-width="2"/>
<text x="400" y="461" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">1</text>
<line x1="480" y1="420" x2="480" y2="430" stroke="#64748b" stroke-width="2"/>
<text x="480" y="461" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">2</text>
<line x1="160" y1="425" x2="240" y2="425" stroke="#0f766e" stroke-width="6"/>
<line x1="400" y1="425" x2="480" y2="425" stroke="#0f766e" stroke-width="6"/>
<circle cx="160" cy="425" r="7" fill="none" stroke="#0f766e" stroke-width="3"/>
<circle cx="240" cy="425" r="7" fill="none" stroke="#0f766e" stroke-width="3"/>
<circle cx="400" cy="425" r="7" fill="none" stroke="#0f766e" stroke-width="3"/>
<circle cx="480" cy="425" r="7" fill="none" stroke="#0f766e" stroke-width="3"/>
<text x="320" y="515" font-size="28" fill="#0f766e" text-anchor="middle" font-weight="400">D = (−2, −1) ∪ (1, 2)</text>
<text x="320" y="558" font-size="24" fill="#64748b" text-anchor="middle" font-weight="400">空心端点表示不包含该点</text>
</g>
</svg>
