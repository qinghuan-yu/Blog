<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">Vue 图层：显示与命中各有顺序</title>
<desc id="desc">底图位于 z-index 1，高亮透明 PNG 位于 10，DOM 装饰边框位于 20。顶层设置 pointer-events none 后，指针命中可交给下方承载交互的高亮层。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">Vue 图层：显示与命中各有顺序</text>
<text x="320" y="84" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">三层共用同一定位容器</text>
<polygon points="65,180 450,180 555,270 170,270" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="305" y="232" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="600">DOM 边框 · z-index: 20</text>
<polygon points="65,360 450,360 555,450 170,450" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="305" y="412" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">高亮 PNG · z-index: 10</text>
<polygon points="65,555 450,555 555,645 170,645" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="305" y="607" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">灰色底图 · z-index: 1</text>
<text x="295" y="310" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">pointer-events: none</text>
<text x="305" y="496" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">高亮层接收悬停 / 点击</text>
<path d="M505 114 V407" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="520" y="111" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">指针</text>
<circle cx="505" cy="411" r="8" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<path d="M65 180 V555" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/>
<path d="M555 270 V645" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/>
<text x="320" y="710" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">上层装饰保持可见，交互交给下层</text>
<text x="320" y="754" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">PNG 透明像素仍在元素矩形命中范围内</text>
</g>
</svg>
