<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">Holdout：让高亮层保留遮挡</title>
<desc id="desc">隐藏桌子时高亮模型的下半部分也会被渲染；桌子使用 Holdout 时，被桌面遮挡的像素透明。高亮层叠回灰色底图后保留相同的遮挡边界。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">Holdout：让高亮层保留遮挡</text>
<text x="320" y="84" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">同一摄像机 · 同一构图与输出尺寸</text>
<text x="170" y="139" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">隐藏桌子</text>
<text x="470" y="139" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">桌子设为 Holdout</text>
<rect x="40" y="165" width="260" height="315" rx="10" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="340" y="165" width="260" height="315" rx="10" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="115" y="200" width="110" height="235" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<path d="M60 305 H280" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/>
<text x="170" y="463" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">下半模型也露出</text>
<rect x="415" y="200" width="110" height="105" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<path d="M360 305 H580" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/>
<text x="470" y="374" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">Alpha = 0</text>
<text x="470" y="463" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">遮挡处变透明</text>
<text x="320" y="522" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">虚线位置：底图中的桌面边界</text>
<path d="M470 486 H605 V552 H320 V580" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="265" y="582" width="110" height="140" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<polygon points="125,657 455,657 515,690 185,690" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<rect x="185" y="690" width="330" height="38" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320" y="774" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">高亮叠回底图，桌面前后的轮廓对齐</text>
</g>
</svg>
