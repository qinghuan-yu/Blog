<text x="370" y="757" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">敌上野</text>
<text x="274" y="944" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">我下野</text>
<text x="425" y="879" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">敌下野</text>
<circle cx="230" cy="783" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<path d="M340 735 L246 777" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
