<path d="M425 905 L447 942 L400 967" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="6 6"/>
<text x="500" y="1010" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">取资源后撤</text>
<text x="320" y="1100" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">实线：进入方向　虚线箭头：撤退方向</text>
