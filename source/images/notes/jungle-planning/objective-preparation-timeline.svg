<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1070" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">资源刷新之前：三条并行任务</title>
<desc id="desc">以资源刷新为零点，提前90秒确定带线者和退路，60秒边线推进且打野清同侧野，40秒送线过河并争中线，约30秒四人进入资源区占位。敌人接边线则用人数差，不接则继续用兵线施压。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">资源刷新之前：三条并行任务</text>
<text x="320" y="87" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">T = 0 为目标刷新时刻</text>
<text x="174" y="150" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="600">带线者</text>
<text x="350" y="150" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="600">打野</text>
<text x="525" y="150" font-size="24" fill="#64748b" text-anchor="middle" font-weight="600">其余队友</text>
<path d="M80 181 V772" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="33" y="256" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">-90s</text>
<rect x="100" y="205" width="150" height="92" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="175.0" y="243.0" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">确认人选</text>
<text x="175.0" y="275.0" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">传送与退路</text>
<path d="M305 253 H395" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/>
<path d="M480 253 H570" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/>
<path d="M174 305 V335" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<path d="M350 305 V335" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<path d="M525 305 V335" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<text x="33" y="396" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">-60s</text>
<rect x="100" y="345" width="150" height="92" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="175.0" y="399.0" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">边线推进</text>
<rect x="275" y="345" width="150" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="350.0" y="399.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">清同侧野</text>
<path d="M480 393 H570" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/>
<path d="M174 445 V475" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<path d="M350 445 V475" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<path d="M525 445 V475" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<text x="33" y="536" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">-40s</text>
<rect x="100" y="485" width="150" height="92" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="175.0" y="539.0" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">兵线过河</text>
<path d="M305 533 H395" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/>
<rect x="450" y="485" width="150" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="525.0" y="539.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">争取中线</text>
<path d="M174 585 V615" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<path d="M350 585 V615" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<path d="M525 585 V615" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<text x="33" y="676" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">-30s</text>
<rect x="100" y="625" width="150" height="92" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="175.0" y="679.0" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">保持线压</text>
<rect x="275" y="625" width="150" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="350.0" y="663.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">控入口</text>
<text x="350.0" y="695.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">留惩戒</text>
<rect x="450" y="625" width="150" height="92" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="525.0" y="679.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">四人组占位</text>
<text x="33" y="814" font-size="26" fill="#64748b" text-anchor="middle" font-weight="500">0</text>
<path d="M90 805 H610" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/>
<rect x="30" y="855" width="275" height="100" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="167.5" y="897.0" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">敌人去接边线</text>
<text x="167.5" y="929.0" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">利用人数差开资源</text>
<rect x="335" y="855" width="275" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="472.5" y="897.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">敌人留在正面</text>
<text x="472.5" y="929.0" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">拖住，让边线撞塔</text>
<text x="320" y="1015" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">兵线先到位，入口和视野随之占住</text>
</g>
</svg>
