<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 980" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">最小生成树：加点与加边</title><desc id="desc">无向图AB1、AC3、BC2、BD4、CD5。Prim从D开始依次取DB4、BA1、BC2；Kruskal依次取AB1、BC2，跳过成环AC3，再取BD4，总权值7。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">最小生成树：加点与加边</text>
<text x="320" y="88" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">同一张连通无向图，总权值最小为 7</text>
<path d="M116.598 256.123 L293.402 163.877" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="205" y="195" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">1</text>
<path d="M116.598 283.877 L293.402 376.123" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="205" y="315" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">3</text>
<path d="M320 180 L320 360" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="292" y="270" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">2</text>
<path d="M346.598 163.877 L523.402 256.123" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="435" y="195" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">4</text>
<path d="M346.598 376.123 L523.402 283.877" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="435" y="315" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">5</text>
<circle cx="90" cy="270" r="30" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="90" y="278" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">A</text>
<circle cx="320" cy="150" r="30" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320" y="158" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">B</text>
<circle cx="320" cy="390" r="30" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320" y="398" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">C</text>
<circle cx="550" cy="270" r="30" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="550" y="278" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">D</text>
<text x="40" y="480" font-size="26" fill="#243247" text-anchor="start" font-weight="600">Prim：从 D 开始扩大已有树</text>
<text x="140" y="530" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">D</text>
<path d="M235 522 L290 522" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="310" y="530" font-size="24" fill="#243247" text-anchor="start" font-weight="500">加入 B，边 DB = 4</text>
<text x="140" y="585" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">D、B</text>
<path d="M235 577 L290 577" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="310" y="585" font-size="24" fill="#243247" text-anchor="start" font-weight="500">加入 A，边 BA = 1</text>
<text x="140" y="640" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">D、B、A</text>
<path d="M235 632 L290 632" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="310" y="640" font-size="24" fill="#243247" text-anchor="start" font-weight="500">加入 C，边 BC = 2</text>
<text x="40" y="715" font-size="26" fill="#243247" text-anchor="start" font-weight="600">Kruskal：按边权从小到大尝试</text>
<text x="320" y="768" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">AB = 1：合并 A、B</text>
<text x="320" y="816" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">BC = 2：再合并 C</text>
<text x="320" y="864" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">AC = 3：三点已连通，跳过</text>
<text x="320" y="912" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">BD = 4：最后合并 D</text>
</g>
</svg>
