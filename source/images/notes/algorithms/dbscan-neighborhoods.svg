<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 740" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">DBSCAN：先数邻居，再辨角色</title><desc id="desc">邻域半径ε，MinPts为4且计入自身。核心点邻域至少4个，边界点自身数量不足但邻接核心点，噪声点远离所有核心点。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">DBSCAN：先数邻居，再辨角色</text>
<text x="320" y="88" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">MinPts = 4，邻域计入点自身</text>
<circle cx="290" cy="295" r="80" fill="none" stroke="#0d9488" stroke-width="2"/>
<path d="M290 295 L370 295" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="331" y="280" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">ε</text>
<circle cx="250" cy="300" r="8" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
<circle cx="210" cy="275" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<circle cx="235" cy="345" r="8" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
<circle cx="290" cy="295" r="8" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
<circle cx="280" cy="350" r="8" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
<circle cx="350" cy="300" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<circle cx="520" cy="160" r="8" fill="#64748b" stroke="#64748b" stroke-width="2"/>
<text x="520" y="204" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">噪声</text>
<text x="396" y="340" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">边界点</text>
<text x="255" y="405" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">核心点</text>
<text x="320" y="483" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">圆心邻域有 5 个点 → 核心点</text>
<text x="320" y="532" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">右侧点邻域有 2 个点 → 数量不足</text>
<text x="320" y="574" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="500">它位于核心点邻域内 → 边界点</text>
<text x="320" y="632" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">孤立点不邻接任何核心点 → 噪声</text>
<text x="320" y="690" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">从核心点扩张，把密度相连的点归为一簇</text>
</g>
</svg>
