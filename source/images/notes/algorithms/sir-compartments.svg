<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 850" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">SIR：人群在三个仓室间流动</title><desc id="desc">S、I、R分别表示易感、感染、移出人群比例，和为1。单位时间S到I流量为βSI，I到R流量μI。感染人数比例的变化率等于流入减流出。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">SIR：人群在三个仓室间流动</text>
<text x="320" y="89" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">S、I、R 是比例，S + I + R = 1</text>
<rect x="160" y="140" width="320" height="115" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320" y="185" font-size="28" fill="#64748b" text-anchor="middle" font-weight="600">S · 易感者</text>
<text x="320" y="225" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">尚可被感染</text>
<rect x="160" y="355" width="320" height="115" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320" y="400" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="600">I · 感染者</text>
<text x="320" y="440" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">正在传播</text>
<rect x="160" y="570" width="320" height="115" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320" y="615" font-size="28" fill="#64748b" text-anchor="middle" font-weight="600">R · 移出者</text>
<text x="320" y="655" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">康复免疫等移出状态</text>
<path d="M320 255 L320 355" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="410" y="315" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="500">βSI</text>
<path d="M320 470 L320 570" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="410" y="530" font-size="28" fill="#0d9488" text-anchor="middle" font-weight="500">μI</text>
<text x="320" y="754" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">dI/dt = 流入 − 流出 = βSI − μI</text>
<text x="320" y="803" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">S &gt; μ/β 时，感染者比例增长</text>
</g>
</svg>
