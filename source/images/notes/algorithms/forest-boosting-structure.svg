<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1050" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">树模型集成：并行平均与逐轮修正</title><desc id="desc">随机森林回归从训练集自助采样训练多棵树，再平均预测。XGBoost从当前预测计算损失的一阶梯度和二阶信息，训练新树并以学习率加入预测，逐轮更新。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">树模型集成：并行平均与逐轮修正</text>
<text x="320" y="92" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">随机森林回归：多棵树并行训练</text>
<rect x="210" y="125" width="220" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320" y="164" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">训练数据</text>
<path d="M320 185 V215 H110 V255" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="30" y="255" width="160" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="110" y="290" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">自助采样</text>
<text x="110" y="322" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">树 1</text>
<path d="M110 341 V375 H320 V410" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M320 185 V215 H320 V255" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="240" y="255" width="160" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320" y="290" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">自助采样</text>
<text x="320" y="322" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">树 2</text>
<path d="M320 341 V375 H320 V410" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M320 185 V215 H530 V255" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="450" y="255" width="160" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530" y="290" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">自助采样</text>
<text x="530" y="322" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">树 3</text>
<path d="M530 341 V375 H320 V410" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="180" y="410" width="280" height="65" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="320" y="452" font-size="26" fill="#0d9488" text-anchor="middle" font-weight="500">各树预测取平均</text>
<text x="320" y="555" font-size="26" fill="#243247" text-anchor="middle" font-weight="600">XGBoost：沿当前损失逐轮加树</text>
<rect x="30" y="595" width="250" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="155" y="648" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">当前预测 Ft−1</text>
<rect x="360" y="595" width="250" height="90" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="485" y="648" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">计算一阶 g、二阶 h</text>
<path d="M280 640 L360 640" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="30" y="760" width="250" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="155" y="813" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">训练新树 ft</text>
<rect x="360" y="760" width="250" height="90" rx="10" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<text x="485" y="813" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">Ft = Ft−1 + ηft</text>
<path d="M280 805 L360 805" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M485 685 V720 H155 V760" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<path d="M485 850 V910 H155 V685" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="320" y="950" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">进入下一轮，重新计算梯度信息</text>
<text x="320" y="1002" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">η 控制每棵新树加入预测的步长</text>
</g>
</svg>
