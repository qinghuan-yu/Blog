<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" data-layout="compact" role="img" aria-labelledby="title desc">
<title id="title">Ridge / Lasso：约束形状改变落点</title><desc id="desc">相同平方损失等高线以无约束最优点(1.6,0.4)为中心。L2单位圆的最近点两系数非零；L1单位菱形的最近点(1,0)位于角点，使第二系数为零。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
</defs>
<g font-family="Georgia, Noto Serif SC, Songti SC, SimSun, serif">
<text x="320" y="42" font-size="28" fill="#243247" text-anchor="middle" font-weight="600">Ridge / Lasso：约束形状改变落点</text>
<text x="320" y="88" font-size="24" fill="#64748b" text-anchor="middle" font-weight="500">同一损失等高线，向约束区域靠近</text>
<text x="320" y="160" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">Ridge：β₁² + β₂² ≤ 1</text>
<path d="M90 360 L580 360" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<path d="M270 495 L270 205" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="590" y="390" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">β₁</text>
<text x="242" y="210" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">β₂</text>
<circle cx="270" cy="360" r="100" fill="#e8f5f3" stroke="#0d9488" stroke-width="2"/>
<circle cx="430" cy="320" r="64.9242" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="430" cy="320" r="89.9242" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="430" cy="320" r="114.924" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="430" cy="320" r="5" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<circle cx="367.014" cy="335.746" r="7" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
<text x="320" y="544" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">落在圆弧：两个系数都非零</text>
<text x="320" y="630" font-size="26" fill="#243247" text-anchor="middle" font-weight="500">Lasso：|β₁| + |β₂| ≤ 1</text>
<path d="M90 830 L580 830" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<path d="M270 965 L270 675" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/>
<text x="590" y="860" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">β₁</text>
<text x="242" y="680" font-size="24" fill="#243247" text-anchor="middle" font-weight="500">β₂</text>
<path d="M370 830 L270 730 L170 830 L270 930 Z" fill="#e8f5f3" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="430" cy="790" r="72.111" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="430" cy="790" r="97.111" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="430" cy="790" r="122.111" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="430" cy="790" r="5" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<circle cx="370" cy="830" r="7" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
<text x="320" y="1014" font-size="24" fill="#0d9488" text-anchor="middle" font-weight="500">落在角点：(β₁, β₂) = (1,0)</text>
</g>
</svg>
